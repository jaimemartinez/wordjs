# WordJS — realistic multi-service stack: Postgres + Redis + TWO app replicas sharing both.
#
#   export WORDJS_JWT_SECRET="$(openssl rand -hex 64)"   # or put it in a .env file next to this one
#   docker compose up --build
#
# `app` and `app2` are the SAME image, both pointed at the SAME Postgres and the SAME Redis with the
# SAME jwtSecret — i.e. two nodes of the horizontally-scaled backend tier from documentation/multi-node.md.
# This is what makes cross-node coherence real: an option / role / capability change on one node is
# published over Redis (wordjs:option-changed) and reflected on the other, and concurrent first-boot is
# serialized by the Redis boot lease so schema migration + seeding run exactly once.
#
# WHAT THIS COMPOSE PROVES: two independent backend cores staying coherent over shared Postgres + Redis
# (the multi-node property), and a working, browsable WordJS on http://localhost:3000.
#
# WHAT IT DOES NOT PROVE (kept honest — see docker/README.md):
#   * No gateway / load balancer sits in front, so it does not exercise gateway round-robin or the
#     mTLS node-enrollment path (scripts/node-join.js). Each replica is browsed on its own port. The
#     coherence bus lives in the backend core, which IS replicated here, so the property is covered;
#     the gateway/mTLS layer adds transport, not coherence.
#   * Shared-filesystem coherence (uploads/themes/plugins/backups) is only partially modeled — a shared
#     volume is mounted at backend/uploads so a file written by one node is visible to the other; themes/
#     plugins/backups/public/ssl are NOT shared here (a production N-replica deploy must mount all of
#     them per multi-node.md). Plugin-activation fan-out therefore isn't representative in this compose.

name: wordjs

x-app-env: &app-env
  # Come up ALREADY INSTALLED, wired from the variables below, with the setup wizard skipped. Required
  # here for two reasons: the database is external (the wizard would otherwise have to be told about
  # Postgres interactively), and `app2` must join the site `app` is already serving rather than run an
  # installer of its own. The cost is that nobody chooses the administrator: the first replica to boot
  # over the empty database creates a bootstrap administrator `admin` with a RANDOM password, written
  # (mode 0600) into that replica's data volume — read it with
  #   docker compose exec app cat /app/backend/data/initial-admin-password
  # (or `app2` if that replica won the boot lease). So this stack CAN be logged into — sign in, change the
  # password and the admin@example.com address, then delete that file. For a site you install and
  # administer through the wizard, use deploy/compose (single container, SQLite, wizard-driven).
  #
  # ⚠ THESE VALUES ARE READ ONCE, ON THE FIRST BOOT OF EACH REPLICA. The entrypoint writes the config
  # into the DATA VOLUME (`app-data` / `app2-data` below) and, on every later start, takes its "existing
  # wordjs-config.json found — leaving it untouched" branch. So after you edit anything here, a plain
  # `docker compose up -d` recreates the containers around the OLD config and the change is silently
  # decorative. Re-up with `docker compose up -d -V` (recreate anonymous/attached volumes) or
  # `docker compose down -v && docker compose up -d --build` to actually apply it.
  WORDJS_PRESEED_CONFIG: "1"
  # Database — shared Postgres. NOTE: the password is deliberately NOT the literal 'password': the app
  # regenerates a random dbPassword when it sees that placeholder, which would break the shared login.
  WORDJS_DB_DRIVER: postgres
  WORDJS_DB_HOST: postgres
  WORDJS_DB_PORT: "5432"
  WORDJS_DB_USER: wordjs
  WORDJS_DB_PASSWORD: wordjs
  WORDJS_DB_NAME: wordjs
  # Redis — shared, enabled (turns on cross-node coherence + shared rate limiting + SSE fan-out).
  WORDJS_REDIS_ENABLED: "true"
  WORDJS_REDIS_HOST: redis
  WORDJS_REDIS_PORT: "6379"
  # SHARED across replicas so tokens issued by one node validate on the other. REQUIRED, with no default:
  # it is the key every session is signed with, and a value printed in this file would let anyone who has
  # read it sign in as the bootstrap administrator (the backend refuses to start on the old placeholder).
  # Generate it with `openssl rand -hex 64` (at least 64 characters; the entrypoint checks).
  WORDJS_JWT_SECRET: ${WORDJS_JWT_SECRET:?set WORDJS_JWT_SECRET, e.g. export WORDJS_JWT_SECRET="$(openssl rand -hex 64)"}
  PORT: "3000"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wordjs
      POSTGRES_PASSWORD: wordjs
      POSTGRES_DB: wordjs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordjs -d wordjs"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
    image: wordjs:local
    environment:
      <<: *app-env
      WORDJS_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      # PER-REPLICA data volume, NAMED on purpose. The image declares `VOLUME /app/backend/data`, so this
      # path gets a volume whether or not one is listed here — and an unlisted one is ANONYMOUS: Compose
      # preserves it across a recreate, `docker volume ls` shows it as a hex blob, and nothing tells you it
      # is the reason an edited `x-app-env` value did not take. Naming it makes the state visible
      # (`docker volume ls`), removable (`docker compose down -v`), and per-node — the config here carries
      # each replica's own siteUrl, and the shared state that MUST be shared lives in Postgres and Redis.
      - app-data:/app/backend/data
      - uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app2:
    # Same image as `app` (built once) — the SECOND node of the backend tier.
    image: wordjs:local
    environment:
      <<: *app-env
      WORDJS_SITE_URL: http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      # Its OWN data volume — see the note on `app`. Sharing one between the replicas would put two
      # processes on one SQLite file and one config; the coherence this stack demonstrates travels over
      # Postgres and Redis, not over a shared data directory.
      - app2-data:/app/backend/data
      - uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Let the first node win the boot lease and run migrations first (both would coordinate over the
      # Redis lease anyway; this just makes the ordering deterministic for a demo).
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  # backend/data per replica: the pre-seeded wordjs-config.json (with its jwtSecret) and the 0600
  # install-token mirror. Named rather than anonymous so `docker volume ls` shows them and
  # `docker compose down -v` really removes them — see the warning on x-app-env above.
  app-data:
  app2-data:
  uploads:
