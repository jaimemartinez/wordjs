{{- if and .Values.installToken.value (not .Values.installToken.existingSecret) }}
{{- if lt (len .Values.installToken.value) 16 }}
{{- fail "wordjs: installToken.value must be at least 16 characters -- the app ignores anything shorter (logging a warning) and silently generates its own token instead, so a short value here would not be the token in force. Use `openssl rand -hex 24`, or leave it empty and read the generated token from the pod logs." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordjs.fullname" . }}-install-token
  labels:
    {{- include "wordjs.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The one-time token gating POST /api/v1/setup/install, so nobody who can reach a not-yet-installed
  # instance can complete the install before you do. Irrelevant once the site is installed: the setup
  # endpoints refuse to run at all from then on.
  install-token: {{ .Values.installToken.value | quote }}
{{- end }}
