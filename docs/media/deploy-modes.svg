<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img"
     aria-label="The three WordJS deployment modes: monolith runs everything in one process; split runs the gateway, backend and frontend as separate processes on one machine; separate runs them on different machines, with the backend and the frontend each joined to the gateway by mutual TLS. The same install works in all three."
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="dm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171436"/>
      <stop offset="1" stop-color="#241c56"/>
    </linearGradient>
    <linearGradient id="dm-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#dm-bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#dm-sheen)"/>

  <text x="44" y="52" fill="#ffffff" font-size="25" font-weight="700">One install, three shapes</text>
  <text x="44" y="80" fill="#c7d2fe" font-size="15">Start on a laptop, grow to separate machines. Monolith and split share one config file, one database, one uploads dir.</text>

  <!-- ── MONOLITH ──────────────────────────────────────────────────── -->
  <g>
    <rect x="44" y="112" width="340" height="228" rx="16" fill="#0f0c29" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="68" y="144" fill="#ffffff" font-size="16" font-weight="700">monolith</text>
    <text x="68" y="166" fill="#a5b4fc" font-size="12">one process · smallest footprint</text>

    <rect x="68" y="184" width="292" height="128" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-dasharray="0"/>
    <text x="214" y="206" fill="#c7d2fe" font-size="11" text-anchor="middle">single Node process</text>
    <rect x="86" y="218" width="82" height="76" rx="8" fill="#312e81"/>
    <text x="127" y="252" fill="#e0e7ff" font-size="11.5" text-anchor="middle">backend</text>
    <rect x="176" y="218" width="82" height="76" rx="8" fill="#312e81"/>
    <text x="217" y="252" fill="#e0e7ff" font-size="11.5" text-anchor="middle">gateway</text>
    <rect x="266" y="218" width="82" height="76" rx="8" fill="#312e81"/>
    <text x="307" y="252" fill="#e0e7ff" font-size="11.5" text-anchor="middle">frontend</text>
    <rect x="86" y="218" width="262" height="76" rx="8" fill="none" stroke="#818cf8" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ── SPLIT ─────────────────────────────────────────────────────── -->
  <g>
    <rect x="404" y="112" width="340" height="228" rx="16" fill="#0f0c29" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="428" y="144" fill="#ffffff" font-size="16" font-weight="700">split</text>
    <text x="428" y="166" fill="#a5b4fc" font-size="12">three processes · one machine</text>

    <rect x="428" y="184" width="292" height="128" rx="12" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="574" y="206" fill="#c7d2fe" font-size="11" text-anchor="middle">one host, restart each alone</text>
    <rect x="446" y="218" width="82" height="76" rx="8" fill="#312e81" stroke="#818cf8"/>
    <text x="487" y="252" fill="#e0e7ff" font-size="11.5" text-anchor="middle">backend</text>
    <rect x="536" y="218" width="82" height="76" rx="8" fill="#312e81" stroke="#818cf8"/>
    <text x="577" y="252" fill="#e0e7ff" font-size="11.5" text-anchor="middle">gateway</text>
    <rect x="626" y="218" width="82" height="76" rx="8" fill="#312e81" stroke="#818cf8"/>
    <text x="667" y="252" fill="#e0e7ff" font-size="11.5" text-anchor="middle">frontend</text>
    <line x1="528" y1="256" x2="536" y2="256" stroke="#a5b4fc" stroke-width="2"/>
    <line x1="618" y1="256" x2="626" y2="256" stroke="#a5b4fc" stroke-width="2"/>
  </g>

  <!-- ── SEPARATE ──────────────────────────────────────────────────── -->
  <g>
    <rect x="764" y="112" width="392" height="228" rx="16" fill="#0f0c29" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="788" y="144" fill="#ffffff" font-size="16" font-weight="700">separate</text>
    <text x="788" y="166" fill="#a5b4fc" font-size="12">different machines · joined by mutual TLS</text>

    <rect x="788" y="184" width="344" height="128" rx="12" fill="#1e1b4b" stroke="#6366f1"/>

    <rect x="806" y="212" width="88" height="82" rx="8" fill="#312e81" stroke="#818cf8"/>
    <text x="850" y="244" fill="#e0e7ff" font-size="11.5" text-anchor="middle">backend</text>
    <text x="850" y="262" fill="#a5b4fc" font-size="10" text-anchor="middle">host A</text>

    <rect x="922" y="212" width="88" height="82" rx="8" fill="#312e81" stroke="#818cf8"/>
    <text x="966" y="244" fill="#e0e7ff" font-size="11.5" text-anchor="middle">gateway</text>
    <text x="966" y="262" fill="#a5b4fc" font-size="10" text-anchor="middle">host B</text>

    <rect x="1038" y="212" width="88" height="82" rx="8" fill="#312e81" stroke="#818cf8"/>
    <text x="1082" y="244" fill="#e0e7ff" font-size="11.5" text-anchor="middle">frontend</text>
    <text x="1082" y="262" fill="#a5b4fc" font-size="10" text-anchor="middle">host C</text>

    <!-- mTLS links -->
    <line x1="894" y1="253" x2="922" y2="253" stroke="#4ade80" stroke-width="2.5"/>
    <line x1="1010" y1="253" x2="1038" y2="253" stroke="#4ade80" stroke-width="2.5"/>
    <circle r="3.5" fill="#86efac">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M894,253 L922,253"/>
    </circle>
    <circle r="3.5" fill="#86efac">
      <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M1010,253 L1038,253"/>
    </circle>
    <text x="966" y="200" fill="#86efac" font-size="10.5" text-anchor="middle">mTLS — each side proves who it is</text>
  </g>

  <g>
    <rect x="44" y="356" width="1112" height="30" rx="8" fill="#3b1259" fill-opacity="0.55"/>
    <text x="64" y="376" fill="#f5d0fe" font-size="12.5">
      Every release smoke-boots the compiled bundle: <tspan font-weight="700">monolith</tspan>, <tspan font-weight="700">split</tspan> — install through the gateway, restart onto mTLS, refuse admin/admin123 — and a freshly <tspan font-weight="700">enrolling node</tspan>.
    </text>
  </g>
</svg>
