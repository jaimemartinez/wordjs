<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"
     aria-label="The WordJS plugin sandbox: plugin code runs in a separate OS process, and every capability it wants must cross a default-deny bridge that the administrator has granted. Requests the admin never approved are refused at the host, and below the bridge the kernel confines the process itself — Landlock and seccomp on Linux, an AppContainer on Windows, Seatbelt on macOS."
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ps-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171436"/>
      <stop offset="1" stop-color="#241c56"/>
    </linearGradient>
    <linearGradient id="ps-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <marker id="ps-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="ps-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1200" height="470" rx="24" fill="url(#ps-bg)"/>
  <rect width="1200" height="470" rx="24" fill="url(#ps-sheen)"/>

  <text x="44" y="52" fill="#ffffff" font-size="25" font-weight="700">A plugin can't take over your site</text>
  <text x="44" y="80" fill="#c7d2fe" font-size="15">Plugin code runs in its own OS process. Every capability is a grant the administrator made.</text>

  <!-- ── plugin process ────────────────────────────────────────────── -->
  <g>
    <rect x="44" y="116" width="286" height="292" rx="16" fill="#2a1033" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="44" y="116" width="286" height="40" rx="16" fill="#4c1d95"/>
    <rect x="44" y="142" width="286" height="14" fill="#4c1d95"/>
    <text x="66" y="143" fill="#f3e8ff" font-size="14" font-weight="600">Plugin process</text>
    <text x="308" y="143" fill="#d8b4fe" font-size="11" text-anchor="end">untrusted</text>

    <text x="66" y="182" fill="#e9d5ff" font-size="12.5">Separate OS process — not a thread.</text>
    <text x="66" y="204" fill="#a78bfa" font-size="11.5">· memory-capped, crash-isolated</text>
    <text x="66" y="224" fill="#a78bfa" font-size="11.5">· no raw fs, no raw sockets, no child procs</text>
    <text x="66" y="244" fill="#a78bfa" font-size="11.5">· its own DB role and table prefix</text>

    <rect x="66" y="266" width="242" height="122" rx="10" fill="#1a0b21" stroke="#6b21a8"/>
    <text x="82" y="290" fill="#c4b5fd" font-size="11.5" font-family="ui-monospace, Consolas, monospace">wordjs.db.all(…)</text>
    <text x="82" y="314" fill="#c4b5fd" font-size="11.5" font-family="ui-monospace, Consolas, monospace">wordjs.http.route(…)</text>
    <text x="82" y="338" fill="#c4b5fd" font-size="11.5" font-family="ui-monospace, Consolas, monospace">wordjs.hooks.addFilter(…)</text>
    <text x="82" y="366" fill="#7c6bb3" font-size="10.5" font-family="ui-monospace, Consolas, monospace">require('child_process') ✗ blocked</text>
  </g>

  <!-- ── the bridge ────────────────────────────────────────────────── -->
  <g>
    <rect x="380" y="116" width="180" height="292" rx="16" fill="#0f0c29" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="470" y="146" fill="#e0e7ff" font-size="14" font-weight="700" text-anchor="middle">Bridge</text>
    <text x="470" y="167" fill="#a5b4fc" font-size="11" text-anchor="middle">default-deny</text>

    <!-- granted -->
    <rect x="398" y="186" width="144" height="30" rx="7" fill="#052e16" stroke="#16a34a"/>
    <text x="470" y="206" fill="#86efac" font-size="11.5" text-anchor="middle">database : read</text>
    <rect x="398" y="224" width="144" height="30" rx="7" fill="#052e16" stroke="#16a34a"/>
    <text x="470" y="244" fill="#86efac" font-size="11.5" text-anchor="middle">settings : read</text>

    <!-- denied -->
    <rect x="398" y="272" width="144" height="30" rx="7" fill="#2b0a0a" stroke="#b91c1c"/>
    <text x="470" y="292" fill="#fca5a5" font-size="11.5" text-anchor="middle">filesystem : write</text>
    <rect x="398" y="310" width="144" height="30" rx="7" fill="#2b0a0a" stroke="#b91c1c"/>
    <text x="470" y="330" fill="#fca5a5" font-size="11.5" text-anchor="middle">network</text>
    <rect x="398" y="348" width="144" height="30" rx="7" fill="#2b0a0a" stroke="#b91c1c"/>
    <text x="470" y="368" fill="#fca5a5" font-size="11.5" text-anchor="middle">settings : write</text>

    <!-- allowed call travelling through -->
    <circle r="5" fill="#4ade80">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M330,240 L398,240"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="330" y1="240" x2="394" y2="240" stroke="#16a34a" stroke-width="2" marker-end="url(#ps-ok)" opacity="0.65"/>

    <!-- refused call bouncing off -->
    <line x1="330" y1="326" x2="394" y2="326" stroke="#b91c1c" stroke-width="2" marker-end="url(#ps-no)" opacity="0.65"/>
    <circle r="5" fill="#f87171">
      <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M330,326 L392,326 L330,326"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── host ──────────────────────────────────────────────────────── -->
  <g>
    <rect x="610" y="116" width="286" height="292" rx="16" fill="#0f2a1a" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="610" y="116" width="286" height="40" rx="16" fill="#14532d"/>
    <rect x="610" y="142" width="286" height="14" fill="#14532d"/>
    <text x="632" y="143" fill="#dcfce7" font-size="14" font-weight="600">Host</text>
    <text x="874" y="143" fill="#86efac" font-size="11" text-anchor="end">trusted</text>

    <text x="632" y="182" fill="#dcfce7" font-size="12.5">Checks every call before it runs.</text>
    <text x="632" y="208" fill="#86efac" font-size="11.5">· SQL guard — own tables only</text>
    <text x="632" y="228" fill="#86efac" font-size="11.5">· path confinement, realpath-checked</text>
    <text x="632" y="248" fill="#86efac" font-size="11.5">· egress allowlist per plugin</text>
    <text x="632" y="268" fill="#86efac" font-size="11.5">· response headers stripped</text>
    <text x="632" y="288" fill="#86efac" font-size="11.5">· crash-strike supervision</text>

    <rect x="632" y="308" width="242" height="80" rx="10" fill="#052e16" stroke="#16a34a"/>
    <text x="648" y="332" fill="#dcfce7" font-size="12" font-weight="600">Your site</text>
    <text x="648" y="356" fill="#86efac" font-size="11.5">core tables · secrets · other plugins</text>
    <text x="648" y="376" fill="#4ade80" font-size="11.5">out of reach by default</text>
  </g>

  <!-- ── admin grants ──────────────────────────────────────────────── -->
  <g>
    <rect x="946" y="116" width="210" height="292" rx="16" fill="#0f0c29" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="1051" y="146" fill="#e0e7ff" font-size="14" font-weight="700" text-anchor="middle">Administrator</text>
    <text x="1051" y="168" fill="#a5b4fc" font-size="11" text-anchor="middle">holds the switches</text>

    <text x="968" y="204" fill="#c7d2fe" font-size="12">A plugin's manifest</text>
    <text x="968" y="224" fill="#c7d2fe" font-size="12"><tspan font-weight="700">requests</tspan> capabilities.</text>
    <text x="968" y="252" fill="#c7d2fe" font-size="12">Nothing is granted</text>
    <text x="968" y="272" fill="#c7d2fe" font-size="12">until you approve it.</text>

    <g>
      <rect x="968" y="300" width="46" height="24" rx="12" fill="#16a34a"/>
      <circle cx="1002" cy="312" r="9" fill="#ffffff"/>
      <text x="1026" y="317" fill="#86efac" font-size="11.5">granted</text>
    </g>
    <g>
      <rect x="968" y="336" width="46" height="24" rx="12" fill="#3f3f56"/>
      <circle cx="980" cy="348" r="9" fill="#cbd5e1"/>
      <text x="1026" y="353" fill="#94a3b8" font-size="11.5">denied</text>
    </g>
    <text x="968" y="392" fill="#a5b4fc" font-size="11">Revoke at any time.</text>
  </g>

  <g>
    <rect x="44" y="426" width="1112" height="30" rx="8" fill="#3b1259" fill-opacity="0.55"/>
    <text x="64" y="446" fill="#f5d0fe" font-size="12.5">A capability the administrator never granted is refused at the host.</text>
    <text x="1136" y="446" fill="#e9b8fb" font-size="11.5" text-anchor="end"><tspan font-weight="700">Kernel confinement:</tspan> Landlock+seccomp (Linux) · AppContainer (Windows) · Seatbelt (macOS)</text>
  </g>
</svg>
