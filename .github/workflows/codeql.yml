name: CodeQL

# Static analysis (SAST) for JavaScript/TypeScript. Findings surface in the repo's Security tab and as
# PR annotations. Runs on push/PR to main and weekly; the analysis job succeeds regardless of findings
# (code scanning reports them, it does not fail the build), so it never blocks a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
          # Test code is not shipped and its fixtures aren't attacker-reachable, so exclude it from the
          # security scan (avoids noise like "missing rate limiting" on a test's throwaway express app).
          config: |
            paths-ignore:
              - '**/tests/**'
              - '**/*.test.ts'
              - '**/*.test.js'
            query-filters:
              # js/missing-token-validation ("Missing CSRF middleware") only recognizes library CSRF
              # middleware (csurf/lusca). WordJS enforces CSRF with a single CENTRALIZED custom guard —
              # `csrfProtection` in backend/src/middleware/auth.ts, an Origin/Referer same-origin allowlist
              # mounted on the whole API prefix (index.ts) BEFORE the routers, and covered by dedicated
              # tests. CodeQL can't model that hand-rolled guard, so it reports EVERY cookie-served handler
              # as "unprotected" — the query is architecturally saturated here and can only ever produce
              # false positives (it cannot distinguish a real gap from the baseline). Exclude it; genuine
              # CSRF regressions are caught by the api-tokens / authz test suites, not this query.
              - exclude:
                  id: js/missing-token-validation

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
