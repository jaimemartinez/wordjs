name: CodeQL

# Static analysis (SAST) for JavaScript/TypeScript. Findings surface in the repo's Security tab and as
# PR annotations. Runs on push to main, on PRs to main or to a feature branch (stacked PRs) and weekly;
# the analysis job succeeds regardless of findings
# (code scanning reports them, it does not fail the build), so it never blocks a merge.
on:
  push:
    branches: [main]
  pull_request:
    # Also a pull request stacked on a feature branch (feat/x on top of feat/y): its code is scanned
    # before it is retargeted to main, not only after.
    branches: [main, 'feat/**', 'fix/**']
  schedule:
    - cron: '27 3 * * 1'

# Workflow-wide floor (see ci.yml). The analyze job below declares its own, WIDER set — a job-level
# `permissions:` REPLACES this block rather than adding to it, so `security-events: write` still
# reaches the upload step. This exists so a job added here later starts read-only by default instead
# of inheriting the repository's default token scope.
# A newer push to the same PR or branch supersedes the running one (2026-10-22, owner: PR CI ~10 min; the
# free plan runs ~20 jobs at once, so superseded runs on main only delay the ones that matter).
concurrency:
  group: codeql-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # GitHub's default job timeout is SIX HOURS: a hung step would look like a slow one
    # forever. See the long note in ci.yml.
    timeout-minutes: 45
    permissions:
      actions: read # the analyze action reads the workflow run's own metadata
      contents: read # checkout
      security-events: write # upload the SARIF to code scanning — the one write this workflow needs
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
          # Test code is not shipped and its fixtures aren't attacker-reachable, so exclude it from the
          # security scan (avoids noise like "missing rate limiting" on a test's throwaway express app).
          config: |
            paths-ignore:
              - '**/tests/**'
              - '**/*.test.ts'
              - '**/*.test.js'
            query-filters:
              # js/missing-token-validation ("Missing CSRF middleware") only recognizes library CSRF
              # middleware (csurf/lusca). WordJS enforces CSRF with a single CENTRALIZED custom guard —
              # `csrfProtection` in backend/src/middleware/auth.ts, an Origin/Referer same-origin allowlist
              # mounted on the whole API prefix (index.ts) BEFORE the routers, and covered by dedicated
              # tests. CodeQL can't model that hand-rolled guard, so it reports EVERY cookie-served handler
              # as "unprotected" — the query is architecturally saturated here and can only ever produce
              # false positives (it cannot distinguish a real gap from the baseline). Exclude it; genuine
              # CSRF regressions are caught by the api-tokens / authz test suites, not this query.
              - exclude:
                  id: js/missing-token-validation

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
