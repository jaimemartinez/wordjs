name: Release

# Publishes a downloadable, pre-compiled WordJS bundle.
#  - Push a tag like `v1.0.0`  -> builds the bundle AND publishes a GitHub Release with the ZIP asset.
#  - Run manually (workflow_dispatch) -> builds the bundle and uploads it as a workflow artifact only
#    (no Release), so you can test the packaging without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege. `contents: write` used to sit HERE, which handed every job in the workflow — the
# verify gate and the npm publish included — a token that can push commits and create releases. Only
# build-release actually publishes, so the write is granted on THAT job (below) and the workflow-wide
# floor is read-only.
permissions:
  contents: read

jobs:
  # GATE THE PUBLISH ON THE SAME CHECKS CI RUNS.
  #
  # release.yml and ci.yml are independent workflows: both fire on the tag push, neither waits for the
  # other, and nothing here ever asked whether CI was green. The existing gates below (smoke-boot in
  # every mode, marketplace integrity) answer "does the artifact BOOT and is it self-consistent?" —
  # they cannot answer "is the code correct and are its dependencies safe?".
  #
  # That gap shipped v1.14.0: `npm audit --omit=dev --audit-level=high` was failing in CI on a HIGH
  # advisory in a production dependency (js-yaml, CVE-2026-59870 — quadratic CPU consumption), and the
  # release published anyway, bundling the vulnerable dependency into the ZIP every operator downloads.
  #
  # Duplicating the checks here rather than waiting on ci.yml is deliberate: a cross-workflow wait is a
  # race (the two start together, and a polling step would have to guess how long to wait), while this
  # is deterministic and self-contained — if it cannot pass, nothing is built and nothing is published.
  verify:
    name: Verify before publishing (audit + typecheck + tests)
    runs-on: ubuntu-latest
    # GitHub's default job timeout is SIX HOURS: a hung step would look like a slow one
    # forever. See the long note in ci.yml.
    #
    # 45, not 20: this single job now carries the work ci.yml spreads over four (backend 22, frontend
    # 15, gateway 15, install-channel 10), on top of one workspace install that is registry-bound and
    # measured at 13 minutes on a cold cache. 20 was sized for "install + backend" and would turn the
    # frontend suite red for running at all. Every added step also carries its own `timeout-minutes`
    # below, so a hang is still named and fails fast rather than eating the job budget.
    timeout-minutes: 45
    permissions:
      contents: read # checkout only — this gate publishes nothing
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            gateway/package-lock.json
            setup/package-lock.json
            packages/create-wordjs/package-lock.json

      - name: Install all workspaces
        run: npm run ci:all

      # The audit that v1.14.0 shipped past. Same command and threshold as ci.yml, in every workspace
      # ci.yml audits — a HIGH advisory in a production dependency must never reach a release asset.
      - name: Audit backend (block high/critical prod vulns)
        working-directory: backend
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs"

      - name: Audit gateway (block high/critical prod vulns)
        working-directory: gateway
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs"

      - name: Audit frontend (block high/critical prod vulns)
        working-directory: frontend
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs"

      # THE INSTALL CHANNEL WAS THE ONE PACKAGE NOBODY AUDITED.
      #
      # This job publishes packages/create-wordjs to npm, and npm is immutable: a bad version can only
      # be succeeded, never corrected. It is also the first command a new user runs
      # (`npx create-wordjs`). It was carrying a HIGH advisory — adm-zip <0.6.0, "crafted ZIP triggers a
      # 4GB allocation" — while the three audited workspaces were clean, because the gate enumerated
      # backend, gateway and frontend and this package is none of them.
      #
      # An audit list that names directories will always miss the next one added. This is the fourth
      # entry rather than a scan because a scan over every package.json would also walk the marketplace
      # plugins, which ship their own dependency trees and are audited by the marketplace gate.
      - name: Audit create-wordjs (block high/critical prod vulns)
        working-directory: packages/create-wordjs
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs"

      - name: Backend type check (strict)
        working-directory: backend
        timeout-minutes: 10
        run: npx tsc --noEmit

      - name: Backend tests
        working-directory: backend
        timeout-minutes: 20
        run: npm test

      # THE GATE TESTED ONE WORKSPACE OUT OF FOUR.
      #
      # Everything above this line runs in `backend/`. The bundle this workflow publishes contains the
      # compiled FRONTEND as well, and the tag also publishes packages/create-wordjs to npm — and
      # neither had a single test run against it before publication, nor did the gateway that fronts a
      # split-mode deployment. The audits were extended to all four workspaces after the adm-zip
      # advisory shipped; the TESTS never were, so "Verify before publishing" answered "are the
      # backend's tests green and are the dependencies safe?" while the release ZIP and the npm
      # package were taken on trust.
      #
      # That is the same shape as the incident recorded at the top of this file: a gate whose name
      # claims more coverage than its steps deliver. The four steps below close it by running exactly
      # what ci.yml runs for those workspaces, with the same prerequisites — a copy, deliberately, for
      # the reason the header already gives: waiting on a sibling workflow is a race, duplicating it
      # is deterministic.
      - name: Generate plugin registries (match the actually checked-out plugins)
        # PREREQUISITE for the frontend type check, lifted verbatim from ci.yml's Frontend job: the
        # committed registries can be generated on a machine that has restricted/local-only plugins
        # (e.g. the gitignored conference-manager), so on a clean checkout tsc fails on a missing
        # module unless they are regenerated first.
        working-directory: frontend
        run: node scripts/generate-plugin-registry.js && node scripts/generate-admin-plugin-registry.js && node scripts/generate-verso-plugin-registry.js

      - name: Frontend type check
        working-directory: frontend
        timeout-minutes: 10
        run: npx tsc --noEmit

      - name: Frontend tests
        # `npm run test` is `vitest run` (frontend/package.json). It needs backend/node_modules as well
        # as its own: three security suites execute backend/src/core/sanitize-meta.ts over the same
        # hostile corpus as the browser sanitizer, and node resolves that module's sanitize-html from
        # the backend tree. `npm run ci:all` above installs both, WITHOUT --omit=dev, so it is there.
        working-directory: frontend
        timeout-minutes: 15
        run: npm run test

      - name: Gateway tests
        working-directory: gateway
        timeout-minutes: 10
        run: npm test

      - name: Install channel dependencies
        # packages/create-wordjs is NOT one of the five workspaces `npm run ci:all` installs (root,
        # backend, frontend, gateway, setup — see scripts/ci-install.mjs), so its tests need their own
        # install. The audit step above got away without one only because `npm audit` reads the
        # lockfile.
        working-directory: packages/create-wordjs
        run: npm ci || npm install

      - name: Install channel tests
        # The ZERO-TESTS guard is copied from ci.yml along with the suite, and it is not decoration:
        # `node --test test/*.test.js` exits 0 when the shell expands the glob to nothing, so a pattern
        # that matches no files reports a green step having proved nothing — green by absence, on the
        # package that npm publishes IMMUTABLY minutes later.
        working-directory: packages/create-wordjs
        timeout-minutes: 10
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          grep -qE 'tests [1-9]' test-output.log || {
            echo "::error::create-wordjs reported ZERO tests — the runner matched no files, so this step proved nothing."
            exit 1
          }

  build-release:
    name: Build & publish compiled bundle
    needs: verify # nothing is built, and nothing is published, unless the gate above is green
    runs-on: ubuntu-latest
    # GitHub's default job timeout is SIX HOURS: a hung step would look like a slow one
    # forever. See the long note in ci.yml.
    timeout-minutes: 20
    permissions:
      contents: write # the ONLY job that needs it: softprops/action-gh-release creates the Release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            gateway/package-lock.json
            setup/package-lock.json

      # Dev dependencies are needed: make-release.js compiles the frontend (next build),
      # the backend (tsc) and the plugin bundles before zipping.
      - name: Install all workspaces
        run: npm run ci:all

      - name: Build compiled release ZIP
        run: npm run bundle-release

      # SMOKE-BOOT the compiled bundle BEFORE it can be published. This closes the exact gap that
      # shipped v1.6.0 unbootable ("Cannot find module './marketplace'"): CI + tests only ever run the
      # SOURCE (ts-node), and make-release just builds+zips — a file present in src/ but stripped from
      # the compiled dist/ ZIP slips through until a real machine runs it. Here we extract the ZIP,
      # install prod deps, boot the monolith in plain HTTP, and require /healthz to answer (it is
      # registered ABOVE the install guard, so a booting bundle returns 200 even before setup; a
      # crash-on-boot bundle never answers). If it can't boot, the job fails and nothing is published.
      # Deploy the artifact we are about to publish, in EVERY mode it claims to support. This used to
      # boot only the monolith, which is how v1.12.12 was published with split mode unable to install at
      # all. See scripts/smoke-deploy.sh for what each leg asserts and why.
      - name: Deploy the compiled bundle in every mode (fail the release if any mode is broken)
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          unzip -q release/wordjs-compiled-release.zip -d "$work"
          # The ZIP may extract flat or under a single top-level dir — locate the app root by its
          # start:mono script rather than assuming a layout.
          pkg="$(grep -l '"start:mono"' "$work"/package.json "$work"/*/package.json 2>/dev/null | head -1)"
          [ -n "$pkg" ] || { echo "::error::no package.json with a start:mono script found in the bundle"; exit 1; }
          app="$(dirname "$pkg")"
          echo "app root: $app"
          ( cd "$app" && npm run release:install ) || { echo "::error::release:install failed in the extracted bundle"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/smoke-deploy.sh" "$app"

      # Marketplace plugins ship as SEPARATE release assets (one zip per plugin + the catalog
      # index), never inside the core bundle — installs happen from the admin Marketplace tab.
      - name: Build marketplace catalog + plugin zips
        run: npm run build:marketplace

      # The assets uploaded below are what every install downloads, and the installer refuses any
      # package whose sha256 does not match its catalog entry — so a catalog/zip drift here is not a
      # cosmetic problem, it makes the plugin uninstallable for everyone. Verify before publishing:
      # nothing else stands between build:marketplace and a public release asset. (Same gate CI runs
      # per PR; see the "Marketplace catalog integrity" step in ci.yml.)
      - name: Verify the catalog matches the artifacts it publishes
        run: npm run verify:marketplace

      - name: Name the asset after the tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: cp release/wordjs-compiled-release.zip "release/wordjs-${GITHUB_REF_NAME}.zip"

      # Software Bill of Materials (CycloneDX) for the whole workspace — the supply-chain transparency
      # signal enterprise self-hosters check for. Generated on every run (so a workflow_dispatch validates
      # it too) and attached to the GitHub Release on a tag.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0 — pinned to an immutable commit SHA (supply-chain: a moving tag can be repointed to malicious code)
        with:
          path: .
          format: cyclonedx-json
          output-file: release/wordjs-sbom.cdx.json
          artifact-name: wordjs-sbom.cdx.json

      # Always expose the build as a downloadable workflow artifact (useful for manual runs / debugging).
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordjs-compiled-release
          path: release/wordjs-compiled-release.zip
          if-no-files-found: error

      - name: Upload marketplace artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordjs-marketplace
          path: marketplace/dist/
          if-no-files-found: error

      # On a version tag, publish a GitHub Release and attach the versioned ZIP + marketplace assets
      # (the backend's default marketplace source is releases/latest/download/marketplace-index.json).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 — pinned to an immutable commit SHA
        with:
          generate_release_notes: true
          files: |
            release/wordjs-${{ github.ref_name }}.zip
            release/wordjs-sbom.cdx.json
            marketplace/dist/*
          body: |
            Pre-compiled WordJS bundle — download `wordjs-${{ github.ref_name }}.zip`, then:

            ```
            npm run release:install   # installs runtime deps only (no compilation)
            npm run start:mono        # one process, one port  (or: npm start for the 3-service split)
            ```

            Finish setup in the browser (install wizard: pick SQLite, PostgreSQL or MySQL/MariaDB — with a live connection test for the server-based engines — then create your admin).
            See `INSTALL.md` inside the bundle and `documentation/deployment.md` for details.

            Or skip the manual download entirely (keep the `@latest` — npx may otherwise re-run a stale cached copy of the CLI):

            ```
            npx create-wordjs@latest my-site
            ```

  # Publishes the `create-wordjs` bootstrapper (packages/create-wordjs) to npm so
  # `npx create-wordjs my-site` always installs the just-released bundle. Runs only on version
  # tags, AFTER the ZIP asset exists (the CLI downloads releases/latest at runtime).
  #
  # Requires the NPM_TOKEN repository secret (an npm automation token with publish rights).
  # GitHub Actions does not allow `secrets` in a job-level `if:`, so the secret is mirrored into
  # the job env and each step is gated on it.
  #
  # A MISSING SECRET IS A FAILED RELEASE, NOT A SKIPPED STEP.
  #
  # Every step here used to skip cleanly when NPM_TOKEN was absent, and a final step printed a
  # `::notice::` — so the workflow went GREEN on a version tag having published a GitHub Release
  # whose own notes tell the reader to run `npx create-wordjs@latest`. That command would have
  # installed the PREVIOUS version: the install channel, the first command a new user runs, silently
  # stayed behind while the tag was reported as fully released. "Configured to skip" and "the secret
  # fell out of the repo settings" produce the identical green.
  #
  # So the two cases are now told apart by the trigger, which is the thing that actually distinguishes
  # them:
  #   · TAG push  -> publishing is part of the release. No token, no release: the job FAILS with an
  #                  `::error::` naming the tag that did not reach npm.
  #   · Manual run -> packaging rehearsal, nothing is being released. Unchanged: `::notice::` and skip.
  # (Today the job-level `if:` below already restricts this job to tag pushes, so the manual-run branch
  # is the documented behaviour should that gate ever be widened — not a second live path.)
  npm-publish:
    name: Publish create-wordjs to npm
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # GitHub's default job timeout is SIX HOURS: a hung step would look like a slow one
    # forever. See the long note in ci.yml.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        if: env.NPM_TOKEN != ''
        uses: actions/checkout@v6

      - name: Setup Node
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Keep the published version in lockstep with the release tag (v1.2.3 -> 1.2.3), so every
      # tag publishes a fresh version and `npx create-wordjs` matches the ZIP it downloads.
      - name: Sync package version to the tag
        if: env.NPM_TOKEN != ''
        working-directory: packages/create-wordjs
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: packages/create-wordjs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # On a TAG, the install channel is part of the release. Fail loudly: a green run here means
      # "v2.1.0 is released", and it is not released if `npx create-wordjs@latest` still fetches 2.0.0.
      - name: Missing NPM_TOKEN on a version tag (fail the release)
        if: env.NPM_TOKEN == '' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error::NPM_TOKEN is not configured, so create-wordjs was NOT published for ${GITHUB_REF_NAME}. The GitHub Release exists but the install channel is stale: 'npx create-wordjs@latest' still installs the PREVIOUS version. Add an npm automation token as the NPM_TOKEN repository secret and re-run this job."
          exit 1

      # On a manual run nothing is being released — the workflow is packaging for inspection — so a
      # missing token is a note, not a failure.
      - name: Skipped (NPM_TOKEN not configured, manual run)
        if: env.NPM_TOKEN == '' && github.event_name == 'workflow_dispatch'
        run: echo "::notice::NPM_TOKEN secret is not configured — skipping the create-wordjs npm publish. This is a manual run, so nothing is being released. Add an npm automation token as the NPM_TOKEN repo secret to enable publishing."
