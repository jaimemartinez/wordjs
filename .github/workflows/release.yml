name: Release

# Publishes a downloadable, pre-compiled WordJS bundle.
#  - Push a tag like `v1.0.0`  -> builds the bundle AND publishes a GitHub Release with the ZIP asset.
#  - Run manually (workflow_dispatch) -> builds the bundle and uploads it as a workflow artifact only
#    (no Release), so you can test the packaging without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  build-release:
    name: Build & publish compiled bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            gateway/package-lock.json
            setup/package-lock.json

      # Dev dependencies are needed: make-release.js compiles the frontend (next build),
      # the backend (tsc) and the plugin bundles before zipping.
      - name: Install all workspaces
        run: npm run install:all

      - name: Build compiled release ZIP
        run: npm run bundle-release

      # SMOKE-BOOT the compiled bundle BEFORE it can be published. This closes the exact gap that
      # shipped v1.6.0 unbootable ("Cannot find module './marketplace'"): CI + tests only ever run the
      # SOURCE (ts-node), and make-release just builds+zips — a file present in src/ but stripped from
      # the compiled dist/ ZIP slips through until a real machine runs it. Here we extract the ZIP,
      # install prod deps, boot the monolith in plain HTTP, and require /healthz to answer (it is
      # registered ABOVE the install guard, so a booting bundle returns 200 even before setup; a
      # crash-on-boot bundle never answers). If it can't boot, the job fails and nothing is published.
      # Deploy the artifact we are about to publish, in EVERY mode it claims to support. This used to
      # boot only the monolith, which is how v1.12.12 was published with split mode unable to install at
      # all. See scripts/smoke-deploy.sh for what each leg asserts and why.
      - name: Deploy the compiled bundle in every mode (fail the release if any mode is broken)
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          unzip -q release/wordjs-compiled-release.zip -d "$work"
          # The ZIP may extract flat or under a single top-level dir — locate the app root by its
          # start:mono script rather than assuming a layout.
          pkg="$(grep -l '"start:mono"' "$work"/package.json "$work"/*/package.json 2>/dev/null | head -1)"
          [ -n "$pkg" ] || { echo "::error::no package.json with a start:mono script found in the bundle"; exit 1; }
          app="$(dirname "$pkg")"
          echo "app root: $app"
          ( cd "$app" && npm run release:install ) || { echo "::error::release:install failed in the extracted bundle"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/smoke-deploy.sh" "$app"

      # Marketplace plugins ship as SEPARATE release assets (one zip per plugin + the catalog
      # index), never inside the core bundle — installs happen from the admin Marketplace tab.
      - name: Build marketplace catalog + plugin zips
        run: npm run build:marketplace

      # The assets uploaded below are what every install downloads, and the installer refuses any
      # package whose sha256 does not match its catalog entry — so a catalog/zip drift here is not a
      # cosmetic problem, it makes the plugin uninstallable for everyone. Verify before publishing:
      # nothing else stands between build:marketplace and a public release asset. (Same gate CI runs
      # per PR; see the "Marketplace catalog integrity" step in ci.yml.)
      - name: Verify the catalog matches the artifacts it publishes
        run: npm run verify:marketplace

      - name: Name the asset after the tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: cp release/wordjs-compiled-release.zip "release/wordjs-${GITHUB_REF_NAME}.zip"

      # Software Bill of Materials (CycloneDX) for the whole workspace — the supply-chain transparency
      # signal enterprise self-hosters check for. Generated on every run (so a workflow_dispatch validates
      # it too) and attached to the GitHub Release on a tag.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0 — pinned to an immutable commit SHA (supply-chain: a moving tag can be repointed to malicious code)
        with:
          path: .
          format: cyclonedx-json
          output-file: release/wordjs-sbom.cdx.json
          artifact-name: wordjs-sbom.cdx.json

      # Always expose the build as a downloadable workflow artifact (useful for manual runs / debugging).
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordjs-compiled-release
          path: release/wordjs-compiled-release.zip
          if-no-files-found: error

      - name: Upload marketplace artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordjs-marketplace
          path: marketplace/dist/
          if-no-files-found: error

      # On a version tag, publish a GitHub Release and attach the versioned ZIP + marketplace assets
      # (the backend's default marketplace source is releases/latest/download/marketplace-index.json).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 — pinned to an immutable commit SHA
        with:
          generate_release_notes: true
          files: |
            release/wordjs-${{ github.ref_name }}.zip
            release/wordjs-sbom.cdx.json
            marketplace/dist/*
          body: |
            Pre-compiled WordJS bundle — download `wordjs-${{ github.ref_name }}.zip`, then:

            ```
            npm run release:install   # installs runtime deps only (no compilation)
            npm run start:mono        # one process, one port  (or: npm start for the 3-service split)
            ```

            Finish setup in the browser (install wizard: pick SQLite or PostgreSQL, create your admin).
            See `INSTALL.md` inside the bundle and `documentation/deployment.md` for details.

            Or skip the manual download entirely:

            ```
            npx create-wordjs my-site
            ```

  # Publishes the `create-wordjs` bootstrapper (packages/create-wordjs) to npm so
  # `npx create-wordjs my-site` always installs the just-released bundle. Runs only on version
  # tags, AFTER the ZIP asset exists (the CLI downloads releases/latest at runtime).
  #
  # Requires the NPM_TOKEN repository secret (an npm automation token with publish rights).
  # GitHub Actions does not allow `secrets` in a job-level `if:`, so the secret is mirrored into
  # the job env and each step is gated on it — when the secret is not configured the steps SKIP
  # cleanly instead of failing the release.
  npm-publish:
    name: Publish create-wordjs to npm
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        if: env.NPM_TOKEN != ''
        uses: actions/checkout@v6

      - name: Setup Node
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Keep the published version in lockstep with the release tag (v1.2.3 -> 1.2.3), so every
      # tag publishes a fresh version and `npx create-wordjs` matches the ZIP it downloads.
      - name: Sync package version to the tag
        if: env.NPM_TOKEN != ''
        working-directory: packages/create-wordjs
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: packages/create-wordjs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skipped (NPM_TOKEN not configured)
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN secret is not configured — skipping the create-wordjs npm publish. Add an npm automation token as the NPM_TOKEN repo secret to enable it."
