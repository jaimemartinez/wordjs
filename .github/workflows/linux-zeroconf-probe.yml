name: Linux zero-config confinement (experiment)

# EXPERIMENT, not yet a gate. It answers one question on a REAL Linux that WordJS actually has to run on:
#
#   Can an isolated plugin be confined at the KERNEL level on a stock host — no sysctl, no root, no
#   AppArmor profile, no compiled artefact — the way Seatbelt already does on macOS and AppContainer on
#   Windows?
#
# The existing Linux floor is bubblewrap, and bwrap always creates a user namespace. Ubuntu 24.04
# restricts unprivileged user namespaces by default, so on a stock host — and on this very runner — the
# whole kernel floor is absent. That is not a hypothetical: the first run of sandbox-parity.yml failed
# here for exactly that reason while the macOS and Windows legs passed.
#
# The candidate is backend/scripts/landlock-seccomp-shim.pl: Landlock for the filesystem, seccomp-bpf for
# the network, both applied by the process to ITSELF before exec'ing Node. Measured already on WSL2
# (kernel 6.6, uid 1000, no sudo): confined got writeOutside=EACCES and tcp=EACCES while an unconfined
# control of the same script got OK and CONNECTED. What WSL could NOT answer is how it behaves on the
# kernels operators actually run — 6.8 and newer, where Landlock also reports ABI 4 — which is what this
# workflow is for.
#
# It is deliberately NOT wired into sandbox-parity.yml yet. An experiment that can fail loudly teaches
# more than a gate added before anyone has seen it run, and this file should be deleted (or promoted)
# once its answer is in.

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/scripts/landlock-seccomp-shim.pl'
      - '.github/workflows/linux-zeroconf-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "ubuntu-latest (stock posture)"
          - os: ubuntu-22.04
            label: "ubuntu-22.04 (older kernel)"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: What this kernel actually offers
        # Facts first, and every one of them read from the machine rather than assumed. The Landlock ABI
        # is asked of the KERNEL via syscall 444, because /sys/kernel/security/lsm lists the LSM as built
        # in even where the ABI is too old to be useful.
        run: |
          echo "kernel:  $(uname -r)   arch: $(uname -m)"
          echo "distro:  $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "perl:    $(perl -v | sed -n 3p)"
          echo "userns restriction (the reason bwrap fails here):"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "  (key absent)"
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || echo "  (key absent)"
          echo -n "landlock ABI reported by the kernel: "
          perl -e 'my $a = syscall(444, 0, 0, 1); print $a >= 1 ? "$a\n" : "unavailable ($!)\n"'
          echo "bwrap present: $(command -v bwrap || echo no)"

      - name: Does bwrap actually work here? (the baseline this is meant to replace)
        # Expected to FAIL on a stock runner. Printed, not asserted: its failure is the premise.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          if bwrap --unshare-user --unshare-net -- /bin/true 2>/tmp/bwrap.err; then
            echo "RESULT: bwrap WORKS on this runner (userns permitted)"
          else
            echo "RESULT: bwrap FAILS on this runner — $(cat /tmp/bwrap.err)"
          fi

      - name: Control and confined, same script, same binary
        # The whole value is the CONTRAST. A refusal only means something if the identical child, run
        # unconfined, is NOT refused — otherwise a broken probe reads exactly like a working sandbox.
        run: |
          set -u
          D="$RUNNER_TEMP/zeroconf"; rm -rf "$D"; mkdir -p "$D/zone" "$D/outside"
          NODE="$(command -v node)"
          cat > "$D/zone/probe.js" <<'JS'
          const fs = require('fs'), net = require('net');
          const out = { uid: process.getuid(), node: process.version };
          try { fs.writeFileSync(process.argv[2] + '/in.txt', 'x'); out.writeInZone = 'OK'; }
          catch (e) { out.writeInZone = e.code; }
          try { fs.writeFileSync(process.argv[3] + '/out.txt', 'x'); out.writeOutside = 'OK'; }
          catch (e) { out.writeOutside = e.code; }
          try { fs.readFileSync('/etc/hostname'); out.readSystem = 'OK'; } catch (e) { out.readSystem = e.code; }
          const done = () => { console.log(JSON.stringify(out)); process.exit(0); };
          // A raw IP, so a refusal can never be confused with a DNS failure.
          try {
            const s = net.connect(80, '1.1.1.1');
            s.on('error', (e) => { out.tcp = e.code; done(); });
            s.on('connect', () => { out.tcp = 'CONNECTED'; done(); });
            setTimeout(() => { out.tcp = 'TIMEOUT'; done(); }, 6000);
          } catch (e) { out.tcp = 'THREW:' + e.code; done(); }
          JS
          echo "--- CONTROL (unconfined) ---"
          "$NODE" "$D/zone/probe.js" "$D/zone" "$D/outside" | tee /tmp/control.json
          echo "--- CONFINED (landlock + seccomp, uid $(id -u), no sudo) ---"
          WORDJS_READ_ROOT="$(dirname "$(dirname "$NODE")")" \
            perl backend/scripts/landlock-seccomp-shim.pl "$D/zone" 1 -- \
            "$NODE" "$D/zone/probe.js" "$D/zone" "$D/outside" | tee /tmp/confined.json
          echo "--- kernel flags inside the confined child ---"
          WORDJS_READ_ROOT="$(dirname "$(dirname "$NODE")")" \
            perl backend/scripts/landlock-seccomp-shim.pl "$D/zone" 1 -- \
            /bin/sh -c 'grep -E "^(NoNewPrivs|Seccomp):" /proc/self/status'

      - name: Verdict
        # Asserts the CONTRAST, not the confined values alone: a control that was already refused would
        # make every line below meaningless, so it is checked first.
        run: |
          set -e
          C=$(cat /tmp/control.json); F=$(cat /tmp/confined.json)
          echo "control : $C"
          echo "confined: $F"
          fail() { echo "VERDICT: FAIL — $1"; exit 1; }
          echo "$C" | grep -q '"tcp":"CONNECTED"'      || fail "the control could not reach the network; nothing below is interpretable"
          echo "$C" | grep -q '"writeOutside":"OK"'    || fail "the control could not write outside the zone; the fs assertion would be vacuous"
          echo "$F" | grep -q '"tcp":"EACCES"'         || fail "the confined child still opened an IP socket"
          echo "$F" | grep -q '"writeOutside":"EACCES"'|| fail "the confined child still wrote outside its zone"
          echo "$F" | grep -q '"writeInZone":"OK"'     || fail "the confined child cannot write its OWN zone — the layer would break plugin storage"
          echo "VERDICT: PASS — kernel-level confinement with no host configuration"
