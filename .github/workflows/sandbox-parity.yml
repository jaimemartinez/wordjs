name: Sandbox parity

# Certifies the production launch path on real kernels. Every platform must retain its native sandbox
# for both network-policy shapes; granting network may change egress and nothing else.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: "${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Linux current (Landlock + seccomp)"
          - os: ubuntu-22.04
            label: "Linux Ubuntu 22.04 runner (Landlock + seccomp)"
          - os: macos-14
            label: "macOS (Seatbelt)"
          - os: windows-latest
            label: "Windows (AppContainer)"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and compile the production sandbox
        working-directory: backend
        run: npm ci && npm run build

      - name: Linux kernel diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "kernel: $(uname -r) arch: $(uname -m) uid: $(id -u)"
          echo "perl: $(command -v perl || echo MISSING)"
          perl -e 'my $a = syscall(444, 0, 0, 1); print((defined($a) && $a >= 1) ? "Landlock ABI $a\n" : "Landlock unavailable ($!)\n");'

      - name: Decision-contract self-test
        run: node backend/scripts/verify-sandbox-parity.mjs --self-test

      - name: Certify the native confinement used by WordJS
        run: node backend/scripts/verify-sandbox-parity.mjs --json=sandbox-parity-report.json

      # THE NON-ROOT + CAPABILITY SHAPE, ON BOTH KERNELS - the configuration that took a site down.
      #
      # WordJS ran as an unprivileged user with systemd `AmbientCapabilities=CAP_NET_BIND_SERVICE` so
      # Node could listen on 443. The shim took "holds a capability" for "is root" and ran root's
      # privilege drop without the privilege to do it: `SHIM-FAIL: setgroups(clear): Operation not
      # permitted`, the probe went 'degraded', and the fail-closed policy refused every plugin. The step
      # above runs as the runner's plain uid, which never holds a capability, so it could not see this.
      #
      # The same failure from the other side: ROOT without CAP_SETGID/CAP_SETPCAP (a unit with
      # CapabilityBoundingSet=, a container started with --cap-drop=ALL + NET_BIND_SERVICE) died on the same
      # steps while the shim chose them from the uid; the shim now runs each one only with the capability
      # it needs, and the probe requires an empty bounding set only when the shim says it emptied it.
      #
      # The legs build those credential shapes with sudo + setpriv (runners have passwordless sudo) - the
      # non-root ones drop straight back to the runner's own uid; nothing persistent changes on the runner:
      #   . verify-shim-nonroot-caps.mjs runs the shim itself: the ambient capability, a setuid-root
      #     wrapper, root with a cut bounding set, root without CAP_SETPCAP, root with a locked securebit,
      #     and a non-root service that does hold CAP_SETGID/CAP_SETPCAP - each against a control that must
      #     really show the shape. Before the fix every one of them but the last exits 79.
      #   . verify-sandbox-parity.mjs then runs the PRODUCTION probe from dist/ inside a Node process that
      #     holds the ambient capability, exactly as the incident's service did, and again as root with the
      #     bounding set cut to CAP_NET_BIND_SERVICE. Each must certify 'active', and the host-privilege
      #     diagnosis (GET /health/details `sandbox.hostPrivilege`) must describe the shape truthfully.
      #     --expect-capability / --expect-root-without refuse to certify if setpriv did not produce it.
      # ubuntu-22.04 is kernel 6.8 - the incident host's kernel.
      - name: Certify the shim and the probe for services holding privilege they cannot fully shed (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node backend/scripts/verify-shim-nonroot-caps.mjs --sudo --json=shim-nonroot-caps-report.json
          sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            --inh-caps=+net_bind_service --ambient-caps=+net_bind_service \
            -- /usr/bin/env HOME="$HOME" PATH="$PATH" "$(command -v node)" \
            backend/scripts/verify-sandbox-parity.mjs --expect-capability=CAP_NET_BIND_SERVICE --json=sandbox-parity-ambient-cap-report.json
          # Root WITHOUT CAP_DAC_OVERRIDE/CAP_DAC_READ_SEARCH is bound by ordinary file permissions:
          # /home/runner is 0750, so it gets the runner's group to read the checkout, and it writes its
          # report to /tmp (the checkout is not writable by it) — the same shape as a systemd service
          # with CapabilityBoundingSet= cut down, which is exactly what this certifies.
          ROOT_REPORT="/tmp/sandbox-parity-root-cut-bounding-$$.json"   # created by that root in /tmp (1777), not pre-created by the runner
          sudo -n setpriv --bounding-set=-all,+net_bind_service --groups "$(id -g)" \
            -- /usr/bin/env HOME="$HOME" PATH="$PATH" "$(command -v node)" \
            backend/scripts/verify-sandbox-parity.mjs --expect-root-without=CAP_SETPCAP --json="$ROOT_REPORT"
          sudo -n chown "$(id -u):$(id -g)" "$ROOT_REPORT"
          mv "$ROOT_REPORT" sandbox-parity-root-cut-bounding-report.json

      # THE JS GUARD LAYER, ON EVERY PLATFORM — the half this matrix was not covering.
      #
      # The step above certifies the KERNEL floor: each platform's probe spawns a confined child beside
      # an unconfined control and reports 'active' only when the confined one was refused what the
      # control was allowed. That has always run here, on all four runners.
      #
      # What did NOT run here is the layer ABOVE it: io-guard, secure-require, the ESM/net guards and the
      # bridge allowlist, exercised by booting REAL malicious plugins in the real fork and driving each
      # escape over the real RPC path. That suite lived only in ci.yml, whose every job is ubuntu-latest,
      # so it had never once executed on macOS or Windows. "Platform-independent JavaScript" is exactly
      # the assumption this repository keeps falsifying — path separators, line endings, and which
      # process APIs even exist all differ, and the suite writes files, forks children and resolves paths.
      #
      # Nine of its assertions are strict containment (`allTrue`); one tolerates 'absent' for three
      # process APIs a platform may not implement, and that leniency is hardened to a hard requirement on
      # Linux inside the suite itself.
      #
      # macOS RAN AND FAILED HERE, AND NOW IT GATES. The first time this suite ever executed on macOS it
      # died in its `before` hook — "Isolated plugin exited during startup (code 1)", no stderr — while
      # every Seatbelt profile variant booted cleanly on its own. Those two facts could not both be the
      # whole story, so the layers were bisected (backend/scripts/diagnose-macos-isolate.mjs):
      #
      #     L0 bare fork ......... BOOTED     L2 + Seatbelt ......... DIED
      #     L1 + ulimit wrapper .. BOOTED     L6 compiled + Seatbelt  BOOTED
      #
      #     Error: EPERM: operation not permitted, uv_cwd
      #         at findAndReadConfig (ts-node/dist/configuration.js)
      #
      # ts-node calls process.cwd() to find tsconfig.json; macOS resolves a working directory by READING
      # each of its ancestors; the profile withholds them deliberately. Source mode only — L6 proves the
      # compiled worker was always fine, which had never been tested either way.
      #
      # Fixed by giving the child a deterministic working directory at the filesystem root (the technique
      # Chromium's Seatbelt design describes), naming ts-node's config outright, and resolving the
      # preload absolutely. No grant changed. Three candidates that also "worked" were rejected or
      # measured dead first; see plugin-isolate.ts.
      - name: Certify the JS guard layer with real forked plugins
        working-directory: backend
        run: node --test --test-force-exit --test-concurrency=1 -r ts-node/register src/tests/sandbox-escape-e2e.test.ts

      # THE SURFACE SWEEPS, ON EVERY PLATFORM THEY CAN RUN ON.
      #
      # The suite above drives named escape vectors. These three drive POPULATIONS, which is the half that
      # does not go stale by addition:
      #   · sandbox-fs-surface-sweep — enumerates fs / fs.promises / fs-promises AT RUNTIME inside a real
      #     isolate and calls every function-valued key against a path outside the plugin's zone. On Node
      #     25 that is 164 entry points. A guard enumerated by hand goes stale the next time Node grows a
      #     method (`glob` in 22, `openAsBlob` in 19, `mkdtempDisposable` since), silently, in the
      #     permissive direction.
      #   · sandbox-reviewed-builtins-escape — attacks the modules the policy classifies as safe, rather
      #     than trusting the classification, and asserts the child's environment contains ONLY what the
      #     allow-list grants. That assertion exists because it did not: libuv injects "required"
      #     variables into every environment block it builds, so on Windows an isolated plugin was
      #     receiving the host's account name, home path, AD domain and domain controller.
      #   · scan-exclusion-parity — the install scanner's skipped directories and the runtime's refusal
      #     must be one set; they had drifted in two ways.
      #
      # Platform matters for all three: path separators, which fs methods exist, and how the platform
      # populates a child's environment all differ, and the environment finding was Windows-only — it
      # would never have surfaced on a Linux-only matrix.
      #
      # macOS is included now that isolated plugins start there. These tests still skip EXPLICITLY rather
      # than returning if an isolate cannot boot, because node:test counts a returned test as a pass and
      # a run that could not exercise them must not be counted as one that did.
      - name: Sweep the guarded surfaces (fs population, module policy, scan parity)
        working-directory: backend
        run: node --test --test-force-exit --test-concurrency=1 -r ts-node/register src/tests/sandbox-fs-surface-sweep.test.ts src/tests/sandbox-reviewed-builtins-escape.test.ts src/tests/scan-exclusion-parity.test.ts src/tests/sandbox-builtin-classification.test.ts

      # These two need no isolate, so they run EVERYWHERE — macOS included. One asserts that the health
      # surface reports what the launcher decides rather than what the policy says (it reported REFUSING
      # on a host that was starting plugins unconfined); the other that the host process never executes
      # third-party code, which is the property every kernel floor depends on and none of them provides.
      - name: Certify the posture and host-execution invariants (all platforms)
        working-directory: backend
        run: node --test --test-force-exit --test-concurrency=1 -r ts-node/register src/tests/sandbox-posture-truthfulness.test.ts src/tests/host-executes-no-foreign-code.test.ts

      # WHICH LAYER WOULD KILL IT — kept AFTER the fix, deliberately.
      #
      # This is what found the cause, and it stays because the next regression in this area will present
      # the same way: "exited during startup (code 1)", nothing on stderr. Its L4 leg runs the product's
      # own loadIsolatedPlugin beside the reconstruction, and that is what caught the fix being wrong the
      # first time — the reconstruction booted while the product did not, because the harness already
      # carried an absolute preload path the product was still missing.
      #
      # A real launch stacks Seatbelt, then the `sh -c 'ulimit …; exec "$@"'` memory cap, then a
      # ts-node preload, on top of the forked worker. Every one of them can end as "exit 1, no stderr",
      # which is all we have had. This boots the same worker with the layers added one at a time and
      # finishes with the product's own loadIsolatedPlugin as a control, so the first layer that flips
      # BOOTED to DIED names itself.
      - name: DIAGNOSTIC (macOS, non-gating) — bisect the confinement layers
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: node backend/scripts/diagnose-macos-isolate.mjs

      # `if: failure()` NEVER FIRED. The diagnostic step above it carries continue-on-error, so the job
      # is not in a failed state when these are evaluated — and the last macOS run confirms it: both of
      # these report "skipped" while the thing they exist to explain had just happened. A diagnostic
      # that cannot run is worse than none, because its presence reads as coverage. They run on macOS
      # now, always, and stay non-gating.
      - name: Differential Seatbelt boot diagnostics
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: node backend/scripts/diagnose-seatbelt-boot.mjs

      - name: macOS Seatbelt denial diagnostics
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          # Child stderr cannot explain a pre-main abort. Seatbelt's own audit stream names the denied
          # operation; keep the query bounded to this job's last two minutes and sandbox events only.
          log show --last 2m --style compact \
            --predicate 'process == "sandboxd" OR eventMessage CONTAINS[c] "Sandbox:"' 2>/dev/null \
            | tail -n 200 || true

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-parity-${{ matrix.os }}
          path: |
            sandbox-parity-report.json
            shim-nonroot-caps-report.json
            sandbox-parity-ambient-cap-report.json
            sandbox-parity-root-cut-bounding-report.json
          retention-days: 14
          if-no-files-found: ignore
