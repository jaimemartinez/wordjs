name: Sandbox parity

# Certifies the production launch path on real kernels. Every platform must retain its native sandbox
# for both network-policy shapes; granting network may change egress and nothing else.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: "${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Linux current (Landlock + seccomp)"
          - os: ubuntu-22.04
            label: "Linux Ubuntu 22.04 runner (Landlock + seccomp)"
          - os: macos-14
            label: "macOS (Seatbelt)"
          - os: windows-latest
            label: "Windows (AppContainer)"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and compile the production sandbox
        working-directory: backend
        run: npm ci && npm run build

      - name: Linux kernel diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "kernel: $(uname -r) arch: $(uname -m) uid: $(id -u)"
          echo "perl: $(command -v perl || echo MISSING)"
          perl -e 'my $a = syscall(444, 0, 0, 1); print((defined($a) && $a >= 1) ? "Landlock ABI $a\n" : "Landlock unavailable ($!)\n");'

      - name: Decision-contract self-test
        run: node backend/scripts/verify-sandbox-parity.mjs --self-test

      - name: Certify the native confinement used by WordJS
        run: node backend/scripts/verify-sandbox-parity.mjs --json=sandbox-parity-report.json

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-parity-${{ matrix.os }}
          path: sandbox-parity-report.json
          retention-days: 14
          if-no-files-found: ignore
