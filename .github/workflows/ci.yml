name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install
      - name: Audit (block high/critical prod vulns)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Type check (strict)
        working-directory: backend
        run: npx tsc --noEmit
      - name: Build (compile to dist — no ts-node in prod)
        working-directory: backend
        run: npm run build
      - name: License gate (block network-copyleft AGPL/SSPL)
        working-directory: backend
        run: npx --yes license-checker --production --failOn 'AGPL;SSPL'
      - name: Test
        working-directory: backend
        run: npm test

  gateway:
    name: Gateway (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json
      - name: Install dependencies
        working-directory: gateway
        run: npm ci || npm install
      - name: Audit (block high/critical prod vulns)
        working-directory: gateway
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        working-directory: gateway
        run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Audit (block high/critical prod vulns)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
