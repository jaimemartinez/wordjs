name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wordjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordjs
          MYSQL_ROOT_HOST: '%' # allow root over TCP from the runner host (not just the container)
        ports:
          - 3306:3306
        # Credentialed ping so "healthy" means mysqld accepts a real root TCP login (the driver's path),
        # not merely that the process is up. Extra retries cover MySQL 8's slower first-boot init.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppassword" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install
      - name: Audit (block high/critical prod vulns)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Type check (strict)
        working-directory: backend
        run: npx tsc --noEmit
      - name: Build (compile to dist — no ts-node in prod)
        working-directory: backend
        run: npm run build
      - name: License gate (block network-copyleft AGPL/SSPL)
        working-directory: backend
        run: npx --yes license-checker --production --failOn 'AGPL;SSPL'
      - name: Test
        # WORDJS_CI_DB=1 turns the driver-conformance suite's postgres+mysql blocks from graceful skips
        # into hard failures: the service containers above are wired precisely so those drivers ARE
        # exercised, so a container that never came up must fail the job, not slip through green. This is
        # the only CI coverage of the SQLite→MySQL translation layer (translateCreateTable/translateSql).
        working-directory: backend
        env:
          WORDJS_CI_DB: '1'
        run: npm test
      - name: Integration tests (Postgres + Redis)
        # Exercises the multi-node coordination paths (dist-lock lease CAS, Redis pub/sub coherence)
        # and the health/metrics endpoints against the real service containers above. config.db
        # defaults (localhost:5432, user postgres, password 'password', db 'wordjs') match the service.
        working-directory: backend
        env:
          REDIS_ENABLED: 'true'
          # Same hard-fail contract as the unit Test step above: the postgres + redis service containers
          # are wired up, so an UNREACHABLE service must FAIL the integration suite — not let the ONLY
          # multi-node coverage (dist-lock lease CAS + Redis pub/sub coherence) silently skip green.
          WORDJS_CI_DB: '1'
        run: npm run test:integration

      - name: Marketplace catalog freshness
        # marketplace/dist/ is the LIVE committed catalog served to every install via
        # raw.githubusercontent.com. The build is deterministic (fixed zip timestamps, no
        # generated-at field), so a plugin change without a rebuilt catalog shows up as a diff.
        run: |
          node backend/scripts/build-marketplace.js
          git diff --exit-code -- marketplace/dist || {
            echo "::error::marketplace/dist is stale — run 'npm run build:marketplace' and commit the result."
            exit 1
          }

  gateway:
    name: Gateway (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json
      - name: Install dependencies
        working-directory: gateway
        run: npm ci || npm install
      - name: Audit (block high/critical prod vulns)
        working-directory: gateway
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        working-directory: gateway
        run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Build vendored editor (@wordjs/puck)
        # The editor is a vendored Puck fork (packages/puck) built from source by tsup; its dist/ is
        # gitignored, so it must be built before type-check/lint/test/build can resolve `@wordjs/puck`.
        # predev/prebuild build it locally too, but CI runs these steps individually — hence its own step.
        working-directory: frontend
        run: npm run build:editor
      - name: Audit (block high/critical prod vulns)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Generate plugin registries (match the actually checked-out plugins)
        # The committed registries can be generated on a machine that has restricted/local-only
        # plugins (e.g. the gitignored conference-manager). Regenerate here so type-check, lint and
        # build only reference plugins present in this checkout — otherwise tsc fails on a missing module.
        working-directory: frontend
        run: node scripts/generate-plugin-registry.js && node scripts/generate-admin-plugin-registry.js && node scripts/generate-puck-plugin-registry.js
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  bundle-boot:
    # SHIFT-LEFT of the release smoke-boot: build the real compiled bundle and boot it ON EVERY PR, so
    # the "present in src/ but stripped from dist/" class (which shipped v1.6.0 unbootable, "Cannot find
    # module './marketplace'") fails the PR — not the release. CI + unit tests only ever run the SOURCE
    # via ts-node; this is the only job that runs the packaged, compiled artifact. Mirrors the
    # "Smoke-boot the compiled bundle" step in release.yml (kept in sync intentionally).
    name: Compiled bundle smoke-boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            gateway/package-lock.json
            setup/package-lock.json
      - name: Install all workspaces
        run: npm run install:all
      - name: Build the compiled release bundle
        run: npm run bundle-release
      - name: Smoke-boot the compiled bundle (fail the PR if it can't boot)
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          unzip -q release/wordjs-compiled-release.zip -d "$work"
          # The ZIP may extract flat or under a single top-level dir — locate the app root by its
          # start:mono script rather than assuming a layout.
          pkg="$(grep -l '"start:mono"' "$work"/package.json "$work"/*/package.json 2>/dev/null | head -1)"
          [ -n "$pkg" ] || { echo "::error::no package.json with a start:mono script found in the bundle"; exit 1; }
          app="$(dirname "$pkg")"
          echo "app root: $app"
          ( cd "$app" && npm run release:install ) || { echo "::error::release:install failed in the extracted bundle"; exit 1; }
          ( cd "$app" && WORDJS_HTTP=1 npm run start:mono ) > "$work/mono.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then ok=1; echo "healthz answered after ~$((i*2))s"; break; fi
            kill -0 "$pid" 2>/dev/null || { echo "::error::monolith process exited during boot"; break; }
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" != 1 ]; then
            echo "==== monolith boot log ===="; cat "$work/mono.log" 2>/dev/null || true
            echo "::error::the compiled bundle did NOT serve /healthz — a PR that produces an unbootable bundle must not merge"; exit 1
          fi
          echo "✅ compiled bundle boots and serves /healthz"
