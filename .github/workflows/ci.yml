name: CI

on:
  push:
  pull_request:

# Least privilege for the GITHUB_TOKEN handed to every job below. Without this block the token keeps
# the repository's DEFAULT permissions, which on many repos still includes write access to contents,
# packages, issues and pull-requests — a scope no CI job here needs, and one that a compromised
# dependency running inside `npm ci`/`npm test` would inherit for free.
#
# Every job in this workflow only READS the repository (checkout + install + typecheck/lint/test/build).
# Nothing publishes a release, comments on a PR, pushes a commit or writes a package. `contents: read`
# is therefore the exact scope in use; anything a future job needs must be granted on THAT job, not
# widened here. (actions/upload-artifact in the verso-e2e job authenticates with the Actions runtime
# token, not the GITHUB_TOKEN, so it needs no permission entry.)
permissions:
  contents: read

# EVERY JOB BELOW CARRIES A `timeout-minutes`, because GitHub's default is SIX HOURS.
#
# Without one, a hung step does not fail — it stays "in progress" all afternoon, burns runner
# minutes, and (the part that actually costs) is indistinguishable from a slow run, so nobody looks.
# It happened: two consecutive runs sat 40 and 25 minutes inside the Playwright install while the
# runs pushed after them finished in seven. The slowest job observed across recent green runs takes
# 3 minutes; 15 is five times that — generous on a loaded runner, decisive against a hang.

jobs:
  gates-travel:
    # A GATE THAT DOES NOT TRAVEL IS NOT A GATE.
    #
    # Round 4 of the adversarial review found that frontend/src/components/content/__tests__/
    # blockStyleInjection.test.tsx — six gates presented as the product of a redesign, 691 assertions,
    # green on the author's machine — was UNTRACKED. It did not exist in any checkout but his. The audit
    # that followed found the same thing about ~70 other test files and about a whole workflow
    # (.github/workflows/sandbox-parity.yml). None of it was reachable by CI, and nothing in CI could say
    # so, because a file that is not committed simply is not there: `git diff --exit-code` on it is
    # vacuously green, `vitest run` never sees it, and every report of "N tests passing" is a property of
    # one laptop.
    #
    # This job is the half that CAN travel, because it lives in a file that is committed. It asks two
    # questions that a checkout is able to answer:
    #   1. Is every file on the REQUIRED_GATES manifest below present and tracked? A gate the team relies
    #      on must fail the build while it is missing — that is the only signal that outlives a handoff
    #      note saying "remember to commit these".
    #   2. Is every tracked test file actually RUN by one of the suites this workflow invokes? The sibling
    #      disease: a test that is committed, reviewed, and executed by nobody. `node --test
    #      'src/tests/*.test.ts'` does not recurse, so one subdirectory is enough to make a file invisible
    #      while it looks committed and fine.
    # Neither question needs npm, a database or a build — the job is seconds long and gates nothing else.
    name: Gates that travel (every gate is committed and run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Every required gate file is present and tracked
        # The manifest is deliberately EXPLICIT. A derived check cannot work here: in a CI checkout an
        # untracked file does not exist at all, so "enumerate the test files you can see and check they
        # are tracked" is vacuous by construction — it is exactly the trap the marketplace/dist gate fell
        # into. Naming the files is what gives the check teeth: the build is red until they are committed.
        #
        # Rows are gate files and the sources those gates import (a committed test that imports an
        # uncommitted module fails CI on the import, which reports as a broken suite rather than as a
        # missing gate). Delete a row only when the gate itself is deleted — never to make the job green.
        run: |
          set -u
          missing=""
          while IFS= read -r f; do
            case "$f" in ''|'#'*) continue ;; esac
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || missing="$missing $f"
          done <<'GATES'
          # ── backend gates (node --test src/tests/*.test.ts) ────────────────────────────────────────
          backend/src/tests/account-security-value-gates.test.ts
          backend/src/tests/analytics-retention-couplings.test.ts
          backend/src/tests/analytics-track-bounds.test.ts
          backend/src/tests/anonymous-entry-channels.test.ts
          backend/src/tests/audit-collab-g1.test.ts
          backend/src/tests/audit-collab-x5.test.ts
          backend/src/tests/audit-posts-media-revisions.test.ts
          backend/src/tests/auth-headless-session.test.ts
          backend/src/tests/backup-restore-reporting.test.ts
          backend/src/tests/backup-restore-traversal.test.ts
          backend/src/tests/class-attribute-channel.test.ts
          backend/src/tests/cluster-cert-path-anchor.test.ts
          backend/src/tests/collab-rejection-sites.test.ts
          backend/src/tests/dist-mysql-driver-freshness.test.ts
          backend/src/tests/frontend-purge-root-anchor.test.ts
          backend/src/tests/f0-baseline.test.ts
          backend/src/tests/f0-content-mutation-failures.test.ts
          backend/src/tests/f1-content-schema.test.ts
          backend/src/tests/f2-content-contract.test.ts
          backend/src/tests/f3-content-outbox.test.ts
          backend/src/tests/f4-extensible-revisions.test.ts
          backend/src/tests/f5-visual-contract.test.ts
          backend/src/tests/f6-crash-consistency.test.ts
          backend/src/tests/f6-final-criteria.test.ts
          backend/src/tests/f6-outbox-idempotence.test.ts
          backend/src/tests/f6-performance-budget.test.ts
          backend/src/tests/f6-shadow-rollout.test.ts
          backend/src/tests/health-purge-observability.test.ts
          backend/src/tests/import-post-page-slug-identity.test.ts
          backend/src/tests/install-root-paths.test.ts
          backend/src/tests/mail-server-ownership-class.test.ts
          backend/src/tests/mail-server-ownership-sql.test.ts
          backend/src/tests/mail-server-shared-rows.test.ts
          backend/src/tests/mail-server-ownership.test.ts
          backend/src/tests/menu-term-counts.test.ts
          backend/src/tests/migration-mysql-text-rule.test.ts
          backend/src/tests/mysql-ddl-parsing-classes.test.ts
          backend/src/tests/mysql-driver-dialect.test.ts
          backend/src/tests/mysql-statement-form-classes.test.ts
          backend/src/tests/notices-router.test.ts
          backend/src/tests/plugin-grant-scan.test.ts
          backend/src/tests/post-term-count-transitions.test.ts
          backend/src/tests/post-terms-serialization.test.ts
          backend/src/tests/posts-date-and-slug-identity.test.ts
          backend/src/tests/public-surface-hardening.test.ts
          backend/src/tests/puck-style-injection.test.ts
          backend/src/tests/repo-hygiene-secrets.test.ts
          backend/src/tests/request-field-types.test.ts
          backend/src/tests/sandbox-fs-guard-classes.test.ts
          backend/src/tests/sandbox-macos-profile.test.ts
          backend/src/tests/sandbox-platform-fallback.test.ts
          backend/src/tests/sandbox-windows-appcontainer.test.ts
          backend/src/tests/sanitize-meta-complexity.test.ts
          backend/src/tests/sanitize-meta-prototype-keys.test.ts
          backend/src/tests/settings-notices-route.test.ts
          backend/src/tests/slug-length-bound.test.ts
          backend/src/tests/sqlite-legacy-transaction-cost.test.ts
          backend/src/tests/sudo-gate-classes.test.ts
          backend/src/tests/term-count-locking.test.ts
          backend/src/tests/term-slug-bounds.test.ts
          backend/src/tests/verify-posts-remediation.test.ts
          # ── backend sources those gates import ────────────────────────────────────────────────────
          backend/src/core/analytics-retention.ts
          backend/src/core/content-schema.ts
          backend/src/core/content-schemas-builtins.ts
          backend/src/core/protected-meta.ts
          backend/src/core/revision-constants.ts
          backend/src/core/revision-snapshots.ts
          backend/src/core/sandbox-macos.ts
          backend/src/core/sandbox-windows.ts
          backend/src/drivers/mysql-text-rule.ts
          backend/src/routes/notices.ts
          backend/scripts/verify-sandbox-parity.mjs
          backend/scripts/verify-f0-baseline.ts
          backend/scripts/verify-f1-content-schema.ts
          backend/scripts/generate-f2-contracts.ts
          backend/scripts/verify-f2-contracts.ts
          backend/scripts/verify-f3-transactional-content.ts
          backend/scripts/verify-f4-extensible-revisions.ts
          backend/scripts/verify-f5-visual-contract.ts
          backend/scripts/verify-f6-migration.ts
          scripts/generate-visual-contract.mjs
          backend/content-schema.v1.json
          contracts/visual-contract.v1.json
          backend/src/core/content-contract.ts
          backend/src/core/content-outbox.ts
          backend/src/generated/content-dtos.generated.ts
          backend/src/generated/visual-contract.generated.ts
          backend/f0-baseline.json
          backend/f0-performance-budgets.json
          documentation/adr/0001-f0-foundation-contract.md
          documentation/adr/0002-f1-declarative-content-schema.md
          documentation/adr/0003-f2-generated-content-contracts.md
          documentation/adr/0004-f3-transactional-content-outbox.md
          documentation/adr/0005-f4-versioned-extensible-revisions.md
          documentation/adr/0006-f5-unified-visual-contract.md
          documentation/adr/0007-f6-migration-certification.md
          documentation/generated/plugin-visual-contract.md
          # ── frontend gates (vitest run: src/**/*.test.ts(x)) ──────────────────────────────────────
          frontend/src/__tests__/instrumentationGatewayTls.test.ts
          frontend/src/app/admin/notices/__tests__/noticesLogic.test.ts
          frontend/src/components/__tests__/revisionRestoreDisclosure.test.ts
          frontend/src/lib/revisionRestoreDescription.ts
          frontend/src/components/blocks/__tests__/authorCssVars.test.tsx
          frontend/src/components/blocks/__tests__/classAttributeChannel.test.tsx
          frontend/src/lib/generated/content-client.generated.ts
          frontend/src/lib/generated/__tests__/content-client.generated.test.ts
          frontend/src/components/content/__tests__/blockCssEmission.test.tsx
          frontend/src/components/content/__tests__/blockStyleInjection.test.tsx
          frontend/src/components/verso/editor/__tests__/propertiesPanel.test.tsx
          frontend/src/contexts/ThemeLayoutContext.test.ts
          frontend/src/lib/__tests__/categorySelectorPagination.test.ts
          frontend/src/lib/__tests__/editorPostDate.test.ts
          frontend/src/lib/__tests__/embedHostsCsp.test.ts
          frontend/src/lib/__tests__/mfaApi.test.ts
          frontend/src/lib/__tests__/postEditorCategoryState.test.ts
          frontend/src/lib/__tests__/resolvedPostCategoryFilter.test.ts
          frontend/src/lib/__tests__/sudoProof.test.ts
          frontend/src/lib/__tests__/themeComponentRecipes.test.ts
          frontend/src/lib/themeActivationEvents.test.ts
          frontend/src/lib/verso/collab/__tests__/collab-refusals.test.ts
          # ── frontend sources those gates import ───────────────────────────────────────────────────
          frontend/embed-hosts.js
          frontend/src/app/admin/notices/noticesLogic.ts
          frontend/src/app/admin/notices/page.tsx
          frontend/src/app/admin/posts/[id]/categoryEditorState.ts
          frontend/src/app/admin/users/UserMfaReset.tsx
          frontend/src/components/blocks/safeStyle.ts
          frontend/src/contexts/ThemeLayoutContext.tsx
          frontend/src/lib/themeActivationEvents.ts
          frontend/src/lib/themeComponentRecipes.ts
          frontend/src/generated/visual-contract.generated.ts
          frontend/src/generated/visual-contract.types.generated.ts
          frontend/src/generated/verso-registry.generated.ts
          frontend/src/lib/themeTokenPolicy.ts
          # ── gateway gates (node --test test/*.test.js) ────────────────────────────────────────────
          gateway/src/registration.js
          gateway/src/routing.js
          gateway/test/dispatcher-parity.test.js
          gateway/test/registration.test.js
          gateway/test/worker-registry.test.js
          # ── a workflow is a gate too: these run nowhere while they are untracked ──────────────────
          .github/workflows/sandbox-parity.yml
          .github/workflows/f6-certification.yml
          GATES
          if [ -n "$missing" ]; then
            for f in $missing; do
              echo "::error file=$f::this gate is NOT TRACKED by git — it runs on its author's machine and nowhere else"
            done
            echo "::error::REQUIRED_GATES: the files above are missing from the repository. Commit them (git add -f <path>) or delete the row that names them; a gate that does not travel is not a gate."
            exit 1
          fi
          echo "all required gate files are present and tracked"

      - name: Every tracked test file is actually run by a suite
        # Each pattern is one of the commands this workflow invokes. A test file that matches none of them
        # is committed but executed by nobody — the same "green while verifying nothing" outcome as an
        # untracked one, reached from the other direction. Note the anchors: `node --test
        # 'src/tests/*.test.ts'` does NOT recurse, so a file one directory deeper is silently not run.
        run: |
          set -u
          orphans=""
          for f in $(git ls-files | grep -Ei '\.(test|spec)\.[jt]sx?$'); do
            case "$f" in
              # backend/package.json → "test": node --test src/tests/*.test.ts  (flat, no recursion)
              backend/src/tests/*.test.ts)              echo "$f" | grep -Eq '^backend/src/tests/[^/]+\.test\.ts$' || orphans="$orphans $f" ;;
              # backend/package.json → "test:integration": src/tests-integration/*.test.ts
              backend/src/tests-integration/*.test.ts)  echo "$f" | grep -Eq '^backend/src/tests-integration/[^/]+\.test\.ts$' || orphans="$orphans $f" ;;
              # frontend/vitest.config.mts → include: src/**/*.test.ts, src/**/*.test.tsx
              frontend/src/*.test.ts|frontend/src/*.test.tsx) ;;
              # frontend/playwright.config.ts → testDir ./e2e, testMatch /verso\/.*\.spec\.ts/
              frontend/e2e/verso/*.spec.ts)             echo "$f" | grep -Eq '^frontend/e2e/verso/[^/]+\.spec\.ts$' || orphans="$orphans $f" ;;
              # gateway/package.json → "test": node --test test/*.test.js  (flat, no recursion)
              gateway/test/*.test.js)                   echo "$f" | grep -Eq '^gateway/test/[^/]+\.test\.js$' || orphans="$orphans $f" ;;
              # packages/create-wordjs/package.json → "test": node --test test/*.test.js  (flat, no
              # recursion), run by the `install-channel` job below. The glob was written as `test/**`
              # first, which bash-without-globstar does not expand and Node then re-globs — and
              # `node --test` exits 0 when a pattern matches NOTHING, so that spelling could have
              # reported a green step over zero tests. Flat glob here, plus a non-zero-count assertion
              # in the job itself.
              packages/create-wordjs/test/*.test.js)    echo "$f" | grep -Eq '^packages/create-wordjs/test/[^/]+\.test\.js$' || orphans="$orphans $f" ;;
              # KNOWN AND NOT RUN IN CI, stated rather than tolerated in silence. Both are plugin-local
              # suites with no runner: backend/plugins/hello-world is the sample plugin's own test, and
              # marketplace/plugins/mail-server ships its unit test inside the package. Give either one a
              # CI step and delete its row; add a new row only WITH the reason.
              backend/plugins/hello-world/tests/hello-world.test.js) ;;
              marketplace/plugins/mail-server/lib/sanitize-email-html.test.js) ;;
              *) orphans="$orphans $f" ;;
            esac
          done
          if [ -n "$orphans" ]; then
            for f in $orphans; do
              echo "::error file=$f::this test file is committed but no CI suite runs it"
            done
            echo "::error::A committed test nobody executes is as green as an uncommitted one. Move it where a runner globs it, add the runner to this workflow, or classify it above WITH a reason."
            exit 1
          fi
          echo "every tracked test file is claimed by a suite this workflow runs"

      - name: Every job in every workflow declares a measured timeout-minutes
        # THE SIX-HOUR DEFAULT, MADE UNFORGETTABLE.
        #
        # The long note at the top of this file explains the incident: two runs sat 40 and 25 minutes
        # inside a Playwright install while runs pushed after them finished in seven, and nothing was
        # red — GitHub's default job timeout is SIX HOURS, so a hang is indistinguishable from a slow
        # run and nobody looks. Every job in the repository was then given a measured `timeout-minutes`.
        #
        # That fix was a one-time sweep, and a one-time sweep is exactly the kind of guarantee this
        # programme keeps having to re-establish: the eleventh job was compliant, the twelfth (written
        # next month, by anyone) inherits six hours again and no gate notices. F6 adds certification
        # legs of its own — long ones, against three database engines and a deliberately dead Redis —
        # which is precisely where a silent hang is most expensive. So the property becomes DERIVED:
        # every job of every workflow, discovered by reading the files, not by consulting a list.
        #
        # ADDING A JOB WITHOUT A TIMEOUT TURNS THIS RED. That is the whole test of whether it is real.
        # It is a small awk rather than a YAML parser on purpose (no dependency to install for a job
        # that must stay seconds long): job ids are the only 2-space-indented keys under `jobs:`, and
        # job properties are the 4-space-indented ones — so `timeout-minutes` is looked for at exactly
        # the depth GitHub accepts it, and `matrix:`/`steps:` entries deeper in cannot be mistaken for
        # a job. `on:`'s own `push:`/`pull_request:` keys sit at the same indent, which is why the
        # scan only starts after the top-level `jobs:` line and stops at the next top-level key.
        run: |
          set -u
          failed=0
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$workflow" ] || continue
            missing="$(awk '
              /^jobs:[[:space:]]*(#.*)?$/ { injobs = 1; next }
              injobs && /^[^[:space:]#]/ { injobs = 0 }
              injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*(#.*)?$/ {
                if (job != "" && !seen) print job
                job = $1; sub(/:$/, "", job); seen = 0; next
              }
              injobs && /^    timeout-minutes:/ { seen = 1 }
              END { if (job != "" && !seen) print job }
            ' "$workflow")"
            for job in $missing; do
              echo "::error file=$workflow::job '$job' has no timeout-minutes — it inherits GitHub's SIX HOUR default, where a hang looks exactly like a slow run"
              failed=1
            done
          done
          if [ "$failed" = "1" ]; then
            echo "::error::Give every job a timeout-minutes measured against its observed runtime (the existing jobs use 5–45). A job without one cannot fail fast, and a gate that cannot fail is not a gate."
            exit 1
          fi
          echo "every job in every workflow declares a measured timeout-minutes"

  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    # 22, sized to MEASURED real work, after everything cuttable was cut. Two fixes already landed: the
    # test script is transpile-only (types checked once, by the tsc step, not re-checked per file), and
    # workspace installs run in parallel. With those, the failing run's own step timing shows where the
    # 15 minutes actually went, and it is not the tests:
    #
    #     Install 207s · Audit 196s · License gate 126s  = ~9 min of NETWORK steps
    #     Type check 7s · Build 6s                        = the suite tooling is fast
    #     Test 310s and still running when the wall hit
    #
    # Install and `npm audit` are registry-bound and were at 3-4× their normal cost on the day this was
    # measured (the npm advisory endpoint was timing out outright); the audit is now bounded per-attempt
    # by ci-audit.mjs. The License gate WAS a third live registry hit — `npx license-checker` downloaded
    # the tool every run and spiked to ~7 min on a degraded registry, blowing this budget outright. It is
    # now a pinned backend devDependency, so it installs ONCE as part of the cached `npm ci` and the gate
    # runs the local binary with no network. That removes the only unbounded registry fetch on the
    # critical path. On a warm cache each remaining step is well under a minute; the job needs ~15 min on
    # a cold-cache day and cannot warm the cache until it completes once. 22 keeps margin over that and
    # still catches a real hang; a warm run lands around 10.
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wordjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordjs
          MYSQL_ROOT_HOST: '%' # allow root over TCP from the runner host (not just the container)
        ports:
          - 3306:3306
        # Credentialed ping so "healthy" means mysqld accepts a real root TCP login (the driver's path),
        # not merely that the process is up. Extra retries cover MySQL 8's slower first-boot init.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppassword" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install
      - name: Audit (block high/critical prod vulns)
        working-directory: backend
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs"
      - name: Type check (strict)
        working-directory: backend
        run: npx tsc --noEmit
      - name: Lint
        # Mirrors the frontend `Lint` step. The backend ESLint config existed but was NEVER run in CI,
        # so ~62 errors accumulated unseen; they are now fixed. eslint exits non-zero ONLY on errors
        # (severity 2) — warnings (currently ~120 no-unused-vars, mostly in tests) do NOT fail the job.
        # This is the intended first gate: errors block, warnings are surfaced but tolerated for now.
        working-directory: backend
        run: npm run lint
      - name: Build (compile to dist — no ts-node in prod)
        working-directory: backend
        run: npm run build
      - name: F0 architecture baseline (REST, plugin ABI, typing debt, sandbox and budgets)
        working-directory: backend
        run: npm run verify:f0
      - name: F1 declarative content schema (portable contract + legacy adapter)
        working-directory: backend
        run: npm run verify:f1
      - name: F2 generated content contracts (validators, DTO, OpenAPI, policy and client)
        working-directory: backend
        run: npm run verify:f2
      - name: F3 transactional content (pinned unit-of-work + durable outbox)
        working-directory: backend
        run: npm run verify:f3
      - name: F4 extensible revisions (frozen schema/codecs + legacy restore)
        working-directory: backend
        run: npm run verify:f4
      - name: F5 unified visual contract (generated parsers, renderers and security policy)
        working-directory: backend
        run: npm run verify:f5
      - name: F6 migration and certification (shadow rollout, adapters and the F0 budget)
        working-directory: backend
        run: npm run verify:f6
      - name: License gate (block network-copyleft AGPL/SSPL)
        working-directory: backend
        # license-checker is a pinned devDependency (installed by `npm ci`), so npx resolves the LOCAL
        # binary and makes no network round-trip. Do NOT restore `--yes`: it existed only to auto-confirm
        # a live download, which is exactly the ~7-min registry spike this step used to inflict.
        run: npx license-checker --production --failOn 'AGPL;SSPL'
      - name: Test
        # WORDJS_CI_DB=1 turns the driver-conformance suite's postgres+mysql blocks from graceful skips
        # into hard failures: the service containers above are wired precisely so those drivers ARE
        # exercised, so a container that never came up must fail the job, not slip through green. This is
        # the only CI coverage of the SQLite→MySQL translation layer (translateCreateTable/translateSql).
        working-directory: backend
        env:
          WORDJS_CI_DB: '1'
        run: npm test
      - name: F0 content performance budgets
        working-directory: backend
        run: npm run perf:f0
      - name: Integration tests (Postgres + Redis)
        # Exercises the multi-node coordination paths (dist-lock lease CAS, Redis pub/sub coherence)
        # and the health/metrics endpoints against the real service containers above. config.db
        # defaults (localhost:5432, user postgres, password 'password', db 'wordjs') match the service.
        working-directory: backend
        env:
          REDIS_ENABLED: 'true'
          # Same hard-fail contract as the unit Test step above: the postgres + redis service containers
          # are wired up, so an UNREACHABLE service must FAIL the integration suite — not let the ONLY
          # multi-node coverage (dist-lock lease CAS + Redis pub/sub coherence) silently skip green.
          WORDJS_CI_DB: '1'
        run: npm run test:integration

      - name: Marketplace catalog integrity
        # REPLACES a `git diff --exit-code -- marketplace/dist` gate that could never fail. Both of the
        # premises it was written on were false: marketplace/dist/ is NOT committed (it is gitignored by
        # `**/dist/` and has zero tracked files, so git had nothing to diff — the step reported green
        # while verifying nothing), and the build was NOT deterministic (build-plugin.js stamped
        # `new Date()` into every bundle banner, so every zip's sha256 changed on every build). The
        # catalog is produced here and by release.yml, which attaches it to the GitHub Release —
        # routes/marketplace.ts documents that a raw.githubusercontent.com/main URL 404s for exactly
        # this reason. "Is the committed catalog fresh?" was never a question that could be asked.
        #
        # verify-marketplace.js asks the question that actually protects installs — does every published
        # zip match the catalog entry advertising it? It re-hashes the bytes ON DISK against the entry's
        # sha256/size (the same check routes/marketplace.ts runs before installing, so a drift bricks
        # every install), compares the manifest INSIDE each zip against the entry, requires every
        # frontend entry a manifest declares to have its compiled dist/*.bundle.js in the package
        # (build-plugin.js skips a declared-but-missing entry silently — that is how a plugin whose admin
        # page can never load shipped twice), rejects packages carrying a plugin's runtime data/ (live
        # secrets, e.g. mail-server's AES root key) or exceeding the installer's 10MB cap, and rejects
        # unreferenced leftovers in dist/ that release.yml would still upload as release assets.
        # --rebuild additionally requires a second build of unchanged sources to be byte-identical, so
        # a published package stays re-derivable from the tagged sources.
        # backend/src/tests/marketplace-catalog.test.ts proves each of these assertions goes red.
        run: |
          node backend/scripts/build-marketplace.js
          node backend/scripts/verify-marketplace.js --rebuild

  multinode:
    # Multi-node coherence leg. Boots TWO backend cores as SEPARATE OS PROCESSES against ONE shared
    # Postgres 16 + Redis 7 and asserts the property that only holds across nodes: an option/role change
    # written on node A is observed on node B via the Redis `wordjs:option-changed` bus + the shared
    # Postgres (documentation/multi-node.md). This is the coherence coverage the single-process
    # coherence.integration.test.ts cannot give — there, publisher and subscriber share one process, so a
    # broken cross-PROCESS path would still pass. Here node B is a real second process (a fork with its own
    # DB pool + its own Redis connections); it can only learn node A's freshly-random value through the
    # shared infrastructure. Break the publish, the DB sharing, or the invalidation → node B never sees it
    # → the job goes red. It also `docker compose config`-validates the Dockerfile/compose stack.
    #
    # This is the deliberately LIGHTER-but-real form the task allows: two app cores in one job sharing
    # DB+Redis. It does not stand up two gateway-fronted, mTLS-enrolled full stacks — the gateway is a
    # single, non-replicated node and the coherence bus lives entirely in the backend core, so replicating
    # that core is exactly what exercises the property.
    name: Multi-node coherence (2 backends, shared PG + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wordjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install
      - name: Multi-node coherence test (node A writes, separate-process node B observes)
        working-directory: backend
        env:
          # Same hard-fail contract as the backend job's DB steps: the postgres + redis services are wired
          # up, so an UNREACHABLE service must FAIL this leg — never let the multi-node coverage skip green.
          WORDJS_CI_DB: '1'
          REDIS_ENABLED: 'true'
        run: npm run test:multinode
      - name: Validate container stack parses (Dockerfile + compose)
        # Cheap wiring check that the compose file is well-formed and references a buildable image — no
        # image build or container boot here (that is intentionally out of the per-PR budget). `config -q`
        # renders and validates the merged compose model, catching env/anchor/service-graph mistakes.
        run: docker compose config -q

  gateway:
    name: Gateway (test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json
      - name: Install dependencies
        working-directory: gateway
        run: npm ci || npm install
      - name: Audit (block high/critical prod vulns)
        working-directory: gateway
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs"
      - name: Test
        working-directory: gateway
        run: npm test

  # THE INSTALL CHANNEL, WHICH NOTHING HERE USED TO RUN.
  #
  # packages/create-wordjs is the first command a new user runs (`npx create-wordjs my-site`) and it is
  # published to npm, which is immutable — a bad version can only be succeeded, never corrected. It had
  # no test script and appeared nowhere in this file, so nothing audited its dependencies (it shipped a
  # HIGH advisory, adm-zip <0.6.0, while the three audited workspaces were clean) and nothing checked
  # that it picks the right file out of a release. It is one small package; there is no reason for it to
  # be the least-verified thing we publish.
  install-channel:
    name: Install channel (create-wordjs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/create-wordjs/package-lock.json
      - name: Install dependencies
        working-directory: packages/create-wordjs
        run: npm ci || npm install
      - name: Audit (block high/critical prod vulns)
        working-directory: packages/create-wordjs
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs"
      # ASSERT THAT IT RAN SOMETHING.
      #
      # `node --test <pattern>` exits 0 when the pattern matches NO files. The script's glob is
      # expanded by the shell, and this runner's shell is not the one it was written on — bash without
      # globstar, Windows cmd and Node's own glob fallback do not agree on `test/**`. So a pattern that
      # silently resolves to nothing here would report a green test step having executed zero tests:
      # green by absence, counted as coverage. That is the defect class this whole package was added to
      # close, so it does not get to hide inside its own gate.
      - name: Test
        working-directory: packages/create-wordjs
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          grep -qE 'tests [1-9]' test-output.log || {
            echo "::error::create-wordjs reported ZERO tests — the runner matched no files, so this step proved nothing."
            exit 1
          }
      # The CLI is a bin script: a syntax error or a stray top-level throw would only surface when a
      # user ran it. `--help` boots the whole file and exits 0.
      - name: The CLI still starts
        working-directory: packages/create-wordjs
        run: node index.js --help > /dev/null

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend and backend deps in parallel
        # Two INDEPENDENT installs that used to run in series. The second exists because three frontend
        # security suites deliberately execute backend/src/core/sanitize-meta.ts over the same hostile
        # corpus as the browser sanitizer; node resolves that module's dependencies from
        # backend/node_modules, not the sibling frontend/node_modules, so a frontend-only install leaves
        # its declared sanitize-html dependency unavailable on a clean runner. On a cold cache the two
        # summed to ~14 min and blew the 15-min ceiling before the suite ran — and a cancelled job saves
        # no cache, so it stayed cold, a deadlock. Run them concurrently: wall time is the LONGER
        # install, not the sum. `wait <pid>` per child propagates a failed install — a bare `wait`
        # returns 0 regardless and would report a broken install as success.
        run: |
          set -u
          ( cd frontend && { npm ci || npm install; } ) & fe=$!
          ( cd backend  && { npm ci --omit=dev || npm install --omit=dev; } ) & be=$!
          rc=0
          wait "$fe" || rc=1
          wait "$be" || rc=1
          exit "$rc"
      - name: Audit (block high/critical prod vulns)
        working-directory: frontend
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs"
      - name: Generate plugin registries (match the actually checked-out plugins)
        # The committed registries can be generated on a machine that has restricted/local-only
        # plugins (e.g. the gitignored conference-manager). Regenerate here so type-check, lint and
        # build only reference plugins present in this checkout — otherwise tsc fails on a missing module.
        working-directory: frontend
        run: node scripts/generate-plugin-registry.js && node scripts/generate-admin-plugin-registry.js && node scripts/generate-verso-plugin-registry.js
      - name: Token manifest anti-drift gate
        # backend/public/theme-tokens.json is COMMITTED and derived deterministically from
        # backend/public/css/wordjs-ui.css (no timestamps, stable key order), so unlike the plugin
        # registries above it is regenerated AND diffed: an edit to ui.css without regenerating the
        # manifest must fail here. The ls-files guard keeps the gate honest — on an untracked file
        # `git diff --exit-code` is vacuously green (the same never-fails trap the old
        # marketplace/dist gate fell into, see the Marketplace catalog integrity step).
        run: |
          git ls-files --error-unmatch backend/public/theme-tokens.json >/dev/null \
            || { echo "::error::backend/public/theme-tokens.json is not tracked by git — commit it or the drift gate can never fail"; exit 1; }
          node scripts/generate-token-manifest.js
          git diff --exit-code -- backend/public/theme-tokens.json \
            || { echo "::error::backend/public/theme-tokens.json is stale — regenerate with 'node scripts/generate-token-manifest.js' and commit the result"; exit 1; }
      - name: Asset version anti-drift gate
        # frontend/src/lib/assetVersion.generated.ts is COMMITTED and is just the sha256 of
        # backend/public/css/wordjs-ui.css (LF-normalized, so Windows checkouts hash the same bytes as
        # this runner). It is the cache-busting token on the long-cached CSS URLs: shipping a ui.css
        # change without regenerating it means every browser keeps the stale sheet for a day — exactly
        # what the old hand-bumped constant did. Same ls-files guard as above: on an untracked file
        # `git diff --exit-code` is vacuously green.
        run: |
          git ls-files --error-unmatch frontend/src/lib/assetVersion.generated.ts >/dev/null \
            || { echo "::error::frontend/src/lib/assetVersion.generated.ts is not tracked by git — commit it or the drift gate can never fail"; exit 1; }
          node scripts/generate-asset-version.js
          git diff --exit-code -- frontend/src/lib/assetVersion.generated.ts \
            || { echo "::error::frontend/src/lib/assetVersion.generated.ts is stale — regenerate with 'node scripts/generate-asset-version.js' and commit the result"; exit 1; }
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  verso-e2e:
    # F6 — programa E2E del editor Verso (Playwright chromium headless) contra un
    # MONOLITO EFÍMERO en HTTP plano (WORDJS_HTTP=1). El webServer lo arranca el
    # propio Playwright (frontend/playwright.config.ts: `npm run dev:mono` desde la
    # raíz; en CI reuseExistingServer=false, así que el runner siempre levanta el
    # suyo). El proyecto `setup` hace login por API (admin/admin123 — la cuenta
    # seed del primer boot en dev) y comparte storageState con los specs.
    #
    # SUPUESTO DOCUMENTADO (F6b lo verifica en el runner): un checkout limpio +
    # dev:mono auto-siembra config/BD/admin en el primer boot, igual que el flujo
    # local de desarrollo. Si el primer boot en Actions exigiera un paso de setup
    # explícito (p. ej. siteUrl/guard de migración), el plan es añadir AQUÍ un paso
    # previo `node setup/index.js --install` con la config mínima HTTP — NUNCA
    # tocar los jobs existentes.
    #
    # PERF (F6b): perf.spec.ts NO escribe sus techos — los lee del presupuesto
    # comprometido backend/f0-performance-budgets.json#versoEditorMilliseconds, así
    # que aquí tampoco se repiten. Se midieron sobre dev-mode y el número FINAL de
    # CI se calibrará en este runner: APRETAR se hace con VERSO_PERF_*_MS en este
    # job, AFLOJAR solo subiendo el presupuesto comprometido, que es donde se
    # revisa — una palanca más floja que él hace que el spec ni se recolecte.
    name: Verso E2E (Playwright chromium, monolito efímero HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            gateway/package-lock.json
      - name: Install all workspaces in parallel (root, backend, frontend, gateway, setup)
        # Was three SEQUENTIAL installs (root → backend → frontend) summing to ~14.5 min. On a cold
        # cache that left nothing under the 15-min ceiling for Playwright + the suite, so the job was
        # cancelled before it could finish once and WARM its cache — a self-perpetuating deadlock (a
        # cancelled job saves no cache, so the next run is cold again). ci:all runs the workspace
        # installs concurrently: wall time becomes the LONGEST single install, not their sum, which
        # fits cold and lets the run complete and warm the cache. See scripts/ci-install.mjs.
        run: npm run ci:all
      - name: Install Playwright chromium (with system deps)
        working-directory: frontend
        # `--with-deps` shells out to apt-get, and both that and the browser download have stalled
        # here for 40+ minutes. `timeout` kills a stuck attempt at five minutes so the retry starts
        # clean: a transient network stall heals itself instead of failing someone's PR, and a real
        # hang fails in ten minutes rather than in six hours. The install itself takes under a minute.
        run: |
          timeout 5m npx playwright install --with-deps chromium ||
          timeout 5m npx playwright install --with-deps chromium
      - name: Run Verso E2E suite (webServer arranca dev:mono WORDJS_HTTP=1)
        working-directory: frontend
        env:
          CI: 'true'
          # Un checkout limpio arranca SIN instalar (todas las rutas 503
          # setup_required), así que el setup e2e instala la instancia por el
          # camino oficial de automatización: servidor y cliente comparten este
          # token efímero (core/install-token.ts lo honra vía env var). El
          # instalador exige contraseña de ≥10 caracteres — de ahí que la de CI
          # no sea la de dev.
          WORDJS_INSTALL_TOKEN: ci-verso-e2e-install-token
          VERSO_E2E_USER: admin
          VERSO_E2E_PASS: verso-e2e-ci-pass
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verso-e2e-traces
          path: frontend/e2e/.results/
          retention-days: 7

  bundle-boot:
    # SHIFT-LEFT of the release smoke gate: build the real compiled bundle and DEPLOY it ON EVERY PR, so
    # the "present in src/ but stripped from dist/" class (which shipped v1.6.0 unbootable, "Cannot find
    # module './marketplace'") fails the PR — not the release. CI + unit tests only ever run the SOURCE
    # via ts-node; this is the only job that runs the packaged, compiled artifact.
    #
    # It used to boot the MONOLITH and stop there, which is why v1.12.12 shipped with split mode unable
    # to install at all and with cluster enrollment self-installing a default administrator: neither is
    # reachable from `start:mono` + /healthz. It now runs scripts/smoke-deploy.sh, which drives mono,
    # split and enrollment. Mirrors the same step in release.yml (kept in sync intentionally — both call
    # the one script).
    name: Compiled bundle smoke-boot
    runs-on: ubuntu-latest
    # 22, for the same measured reason as the Backend job. This is the heaviest job in the matrix: it
    # installs all five workspaces, compiles the whole product (next build + tsc + plugins), then boots
    # the bundle in three modes — and each mode's release:install is ANOTHER runtime-dependency install.
    # On the measured cold/slow-registry run: parallel install cut "Install all workspaces" from 792s to
    # 422s, build was 33s, and Deploy needed more than the 452s it got. Two full dependency installs on
    # a cold cache is the cost; it drops sharply once the cache is warm. Sized to the real work, not to
    # hide a hang — every step here completes.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            gateway/package-lock.json
            setup/package-lock.json
      - name: Install all workspaces
        run: npm run ci:all
      - name: Build the compiled release bundle
        run: npm run bundle-release
      - name: Deploy the compiled bundle in every mode (fail the PR if any mode is broken)
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          unzip -q release/wordjs-compiled-release.zip -d "$work"
          # The ZIP may extract flat or under a single top-level dir — locate the app root by its
          # start:mono script rather than assuming a layout.
          pkg="$(grep -l '"start:mono"' "$work"/package.json "$work"/*/package.json 2>/dev/null | head -1)"
          [ -n "$pkg" ] || { echo "::error::no package.json with a start:mono script found in the bundle"; exit 1; }
          app="$(dirname "$pkg")"
          echo "app root: $app"
          ( cd "$app" && npm run release:install ) || { echo "::error::release:install failed in the extracted bundle"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/smoke-deploy.sh" "$app"
